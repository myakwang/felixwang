<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0b2a47">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Soccer Manager">
<title>Soccer Manager: Road to the World Cup</title>
<style>
@font-face{font-family:"Lilita One";src:url(lilita-one.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:Nunito;src:url(nunito-600.woff2) format("woff2");font-weight:600;font-display:swap}
@font-face{font-family:Nunito;src:url(nunito-800.woff2) format("woff2");font-weight:800;font-display:swap}
@font-face{font-family:Nunito;src:url(nunito-900.woff2) format("woff2");font-weight:900;font-display:swap}
</style>
<style>
:root{--tc:#1d6fe0;--gold:#ffc83d;--bg1:#071a2e;--bg2:#0b2a47;--card:#0f2f50;--line:#1f4d7a;--good:#5cf29a;--bad:#ff7a7a}
*{box-sizing:border-box}
body{margin:0;font-family:Nunito,system-ui,sans-serif;font-weight:700;color:#f2f6ff;min-height:100vh;
 background:radial-gradient(ellipse at 50% -10%,#2a6cb0 0%,transparent 55%),linear-gradient(180deg,var(--bg2),var(--bg1) 60%,#04101d)}
h1,h2,h3,.disp{font-family:"Lilita One",Nunito,sans-serif;font-weight:400;letter-spacing:.5px;margin:.15em 0}
#app{max-width:960px;margin:0 auto;padding:calc(12px + env(safe-area-inset-top)) 12px calc(40px + env(safe-area-inset-bottom));position:relative}
button{font:inherit;font-weight:900;border:none;border-radius:14px;padding:11px 16px;cursor:pointer;color:#fff;background:linear-gradient(180deg,#3fa0ff,#1d6fe0);box-shadow:0 4px 0 #0d3f86;transition:transform .08s,box-shadow .08s}
button:active{transform:translateY(3px);box-shadow:0 1px 0 #0d3f86}
button:disabled{opacity:.4;cursor:not-allowed}
button.gold{background:linear-gradient(180deg,#ffe07a,#ffb703);color:#3a2500;box-shadow:0 4px 0 #b07800}
button.red{background:linear-gradient(180deg,#ff7a7a,#e0393e);box-shadow:0 4px 0 #8f1c20}
button.green{background:linear-gradient(180deg,#5cf29a,#18b85f);color:#06351b;box-shadow:0 4px 0 #0b7a3c}
button.gray{background:linear-gradient(180deg,#5d7590,#3f5670);box-shadow:0 4px 0 #24364a}
button.small{padding:7px 11px;font-size:.85em;border-radius:11px}
.hdr{display:flex;gap:12px;align-items:center;background:linear-gradient(135deg,#0f3a63,#0a2440);border:2px solid var(--line);border-radius:20px;padding:12px 14px;box-shadow:0 8px 24px #0006}
.hdr .tn{font-family:"Lilita One";font-size:1.55em;line-height:1.05}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{background:#ffffff14;border:1px solid #ffffff22;border-radius:999px;padding:3px 10px;font-size:.85em}
.chip.m{background:#ffc83d22;border-color:#ffc83d66;color:var(--gold)}
.goal{white-space:nowrap;overflow:hidden;margin:10px 0;display:flex;gap:10px;align-items:center;background:linear-gradient(90deg,#ffb703,#ffd35a);color:#3a2500;border-radius:14px;padding:8px 14px;font-weight:900;font-size:.9em}
.goal .bar{flex:1;height:10px;background:#0003;border-radius:6px;overflow:hidden}.goal .bar i{display:block;height:100%;background:#3a2500}
.tabs{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin:10px 0 12px}
.tabs button{padding:9px 4px;font-size:.82em;background:#123a63;box-shadow:0 4px 0 #081f38;display:flex;flex-direction:column;align-items:center;gap:2px;position:relative}
.tabs button .ic{font-size:1.5em}
.tabs button.on{background:linear-gradient(180deg,#ffe07a,#ffb703);color:#3a2500;box-shadow:0 4px 0 #b07800}
.badge{position:absolute;top:-6px;right:-4px;background:#e0393e;color:#fff;border-radius:999px;padding:0 7px;font-size:.85em;border:2px solid #071a2e}
.card{background:linear-gradient(180deg,#123a63,#0d2b4b);border:2px solid var(--line);border-radius:18px;padding:14px;margin:10px 0;box-shadow:0 6px 18px #0005}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.muted{opacity:.72;font-size:.86em;font-weight:600}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.sp{flex:1}
/* player cards */
.pc .xi{position:absolute;top:8px;right:10px;background:#1c1300;color:var(--gold);border-radius:999px;padding:1px 8px;font-size:.75em;font-weight:900;z-index:1}
.pos{display:inline-block;border-radius:6px;padding:1px 7px;font-weight:900;font-size:.75em;color:#fff}
.GK{background:#f07b16}.DEF{background:#1d6fe0}.MID{background:#18a457}.FWD{background:#e0393e}
.sks{display:grid;grid-template-columns:1fr 1fr;gap:3px 12px;margin-top:8px;font-size:.84em}
.sks div{display:flex;justify-content:space-between;border-bottom:1px solid #0002}
.sks b{font-family:"Lilita One";font-weight:400;font-size:1.1em}
.en{height:8px;background:#0003;border-radius:5px;overflow:hidden;margin-top:6px}.en i{display:block;height:100%}
.gb{font-size:.8em;margin-top:6px;background:#0000001a;border-radius:8px;padding:4px 7px}
.pc .act{display:flex;gap:6px;margin-top:8px}
.quote{background:#fff;color:#123;border-radius:14px;padding:8px 11px;margin:8px 0 4px;position:relative;font-size:.9em;box-shadow:0 3px 0 #0002}
.quote:before{content:"";position:absolute;left:22px;top:-9px;border:9px solid transparent;border-top:0;border-bottom-color:#fff}
.price{background:#1c1300;color:var(--gold);border-radius:10px;padding:5px 9px;margin-top:8px;font-size:.9em;text-align:center}
/* tables */
table{width:100%;border-collapse:separate;border-spacing:0 4px;font-size:.92em}
th{font-size:.78em;opacity:.7;padding:2px 4px}
td{padding:8px 4px;text-align:center;background:#ffffff0d}
td:first-child{border-radius:10px 0 0 10px}td:last-child{border-radius:0 10px 10px 0}
td.t{text-align:left}
tr.me td{background:#ffc83d33;color:var(--gold)}
tr.q td:first-child{box-shadow:inset 4px 0 0 var(--good)}
tr.r td:first-child{box-shadow:inset 4px 0 0 var(--bad)}
tr.r td{background:#ff7a7a14}
/* training */
.tr{display:flex;align-items:center;gap:8px;margin:7px 0;background:#ffffff0d;border-radius:12px;padding:6px 8px}
.tr .lbl{flex:1}.tr .h{min-width:30px;text-align:center;font-family:"Lilita One";font-size:1.6em;color:var(--gold)}
.dots{display:flex;gap:3px}.dots i{width:10px;height:10px;border-radius:50%;background:#ffffff22}.dots i.f{background:var(--gold)}
/* match */
.sb{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;background:#04101d;border:3px solid #24496f;border-radius:18px;padding:10px 12px}
.sb .tm{font-family:"Lilita One";font-size:1.05em;text-align:center;line-height:1.1}
.sb .sc{font-family:"Lilita One";font-size:2.8em;color:var(--gold);text-shadow:0 0 18px #ffb70388;white-space:nowrap}
.clock{display:inline-block;background:#e0393e;border-radius:8px;padding:1px 10px;font-family:"Lilita One";font-size:1.1em;margin-top:2px}
.pitchwrap{position:relative;margin-top:10px;border-radius:16px;overflow:hidden;border:3px solid #24496f}
canvas#pitch{display:block;width:100%;height:auto}
.flash{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:"Lilita One";font-size:4em;color:#fff;text-shadow:0 4px 0 #0008,0 0 30px #ffb703;pointer-events:none;opacity:0}
.flash.go{animation:pop 1.5s ease-out}
@keyframes pop{0%{opacity:0;transform:scale(.3)}20%{opacity:1;transform:scale(1.15)}35%{transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:scale(1.1)}}
.feed{height:150px;overflow:auto;background:#04101d;border-radius:14px;padding:6px 10px;font-size:.9em;margin-top:10px}
.feed div.comm{color:#8fd3ff;font-style:italic}.feed div{padding:5px 0;border-bottom:1px solid #ffffff10;animation:fadein .3s}
.feed .g{color:var(--gold);font-weight:900}.feed .b{color:var(--bad)}
@keyframes fadein{from{opacity:0;transform:translateY(-4px)}}
.vs{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;text-align:center;gap:8px}
.vs .num{font-family:"Lilita One";font-size:2.4em;color:var(--gold)}
.meter{height:14px;border-radius:8px;overflow:hidden;display:flex;margin:10px 0 4px;background:#0004}
.tip{background:#5cf29a1f;border:1px solid #5cf29a55;border-radius:12px;padding:8px 10px;margin-top:10px;font-size:.9em}
/* modal etc */
#modal{position:fixed;inset:0;background:#000b;display:flex;align-items:center;justify-content:center;z-index:50;padding:14px}
#modal.hide{display:none}
#modal .box{background:linear-gradient(180deg,#164878,#0d2b4b);border:3px solid var(--gold);border-radius:22px;padding:20px;max-width:440px;width:100%;text-align:center;max-height:90vh;overflow:auto;animation:fadein .25s;box-shadow:0 20px 60px #000a}
#modal .btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:16px}
#toast{position:fixed;font-size:.95em;bottom:18px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--gold);color:#3a2500;font-weight:900;padding:10px 16px;border-radius:14px;opacity:0;transition:all .3s;z-index:60;pointer-events:none;max-width:92vw;text-align:center;box-shadow:0 6px 20px #0008}
#toast.show{opacity:1;transform:translateX(-50%)}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:70}
.big{font-size:3.6em;line-height:1.1}
input[type=text]{font:inherit;padding:12px;border-radius:14px;border:3px solid var(--line);width:100%;background:#04101d;color:#fff;font-size:1.15em;text-align:center}
.opts{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:8px 0}
.sw{width:40px;height:40px;border-radius:50%;border:3px solid transparent;cursor:pointer;padding:0;box-shadow:none}
.sw.on{border-color:#fff;transform:scale(1.15)}
.opts button.on{outline:3px solid #fff}
.bracket{display:grid;gap:8px}
.br{display:flex;align-items:center;gap:10px;background:#ffffff0d;border-radius:12px;padding:8px 10px}
.br.now{background:#ffc83d22;outline:2px solid var(--gold)}
.trophies{display:flex;gap:10px;flex-wrap:wrap}
.tro{background:#ffffff10;border-radius:14px;padding:8px 12px;text-align:center}
.ladder{display:flex;align-items:center;gap:3px;margin:8px 0}
.ladder .step{flex:1;text-align:center;padding:7px 2px;border-radius:10px;background:#ffffff12;font-size:.74em;font-weight:900;white-space:nowrap}
.ladder .step.done{background:#5cf29a33;color:var(--good)}
.ladder .step.now{background:linear-gradient(180deg,#ffe07a,#ffb703);color:#3a2500;transform:scale(1.08)}
.ladder .arr{opacity:.5}
.ftov{position:absolute;inset:0;background:#04101dcc;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;animation:fadein .4s}
.mini{position:relative;margin-top:10px;width:100%;aspect-ratio:3/4;max-height:560px;border-radius:16px;overflow:hidden;border:3px solid #24496f;
 background:repeating-linear-gradient(0deg,#37b24d 0 10%,#40c057 10% 20%)}
.zone{position:absolute;left:0;right:0;height:0;border-top:2px dashed #ffffff40;font-size:.7em;font-weight:900;color:#ffffffaa;padding:2px 8px;pointer-events:none}
.zone.ztop{top:0;border-top:none}
.spot{touch-action:none;user-select:none;-webkit-user-select:none}
.spot.dragging{z-index:3;opacity:.9}.spot.dragging .dot{transform:scale(1.25);border-color:var(--gold)}
.mini:before{content:"";position:absolute;left:6%;right:6%;top:4%;bottom:4%;border:2px solid #ffffffaa;border-radius:4px}
.mini:after{content:"";position:absolute;left:30%;right:30%;bottom:4%;height:14%;border:2px solid #ffffffaa;border-bottom:none}
.spot{position:absolute;transform:translate(-50%,-50%);text-align:center;cursor:pointer;z-index:1;width:76px}
.spot .dot{width:40px;height:40px;margin:0 auto;border-radius:50%;border:3px solid #fff;display:flex;align-items:center;justify-content:center;font-family:"Lilita One";font-size:1.1em;color:#fff;text-shadow:0 1px 2px #000;box-shadow:0 3px 6px #0006}
.spot .lbl{font-size:.75em;font-weight:900;text-shadow:0 1px 3px #000;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.spot .lo{font-size:.66em;background:#0009;border-radius:6px;display:inline-block;padding:0 4px;white-space:nowrap}
.spot.off .lo{background:#a3121acc}
.spot.sel .dot{border-color:var(--gold);transform:scale(1.2);box-shadow:0 0 0 4px #ffc83d88}
.benchrow{display:flex;align-items:center;gap:8px;padding:9px 8px;border-radius:10px;background:#ffffff0d;margin:5px 0;cursor:pointer}
.benchrow.can{outline:2px dashed #ffc83d88}
.ovrs{font-family:"Lilita One";color:var(--gold);font-size:1.2em;min-width:30px;text-align:right}
.tabs button{font-size:.75em}
select{font:inherit;font-weight:800;padding:8px;border-radius:10px;background:#04101d;color:#fff;border:2px solid var(--line)}
#nego{position:fixed;inset:0;background:#000c;z-index:55;display:none;align-items:center;justify-content:center;padding:10px}
#nego .nbox{background:linear-gradient(180deg,#164878,#0d2b4b);border:3px solid var(--gold);border-radius:20px;padding:12px;width:100%;max-width:480px;max-height:96vh;overflow:auto}
.ng3d{position:relative;height:220px;border-radius:14px;overflow:hidden;background:linear-gradient(180deg,#1e5a8c,#0f2f50)}
.ng3d canvas{display:block;width:100%;height:100%}
.ngfx{position:absolute;inset:0;pointer-events:none;display:flex;align-items:center;justify-content:center}
.ngfx .pop{position:absolute;font-size:3.5em;animation:pop 1.5s ease-out forwards}
.chat{height:150px;overflow:auto;background:#04101d;border-radius:12px;padding:8px;display:flex;flex-direction:column;gap:6px}
.bub{max-width:82%;padding:7px 10px;border-radius:14px;font-size:.9em;line-height:1.3}
.bub.him{background:#fff;color:#123;align-self:flex-start;border-bottom-left-radius:4px}
.bub.me{background:var(--gold);color:#3a2500;align-self:flex-end;border-bottom-right-radius:4px}
.qs{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.stb{display:inline-block;margin-top:3px;background:#1c1300;color:var(--gold);border-radius:999px;padding:1px 8px;font-size:.75em;font-weight:900;white-space:nowrap}
#cpick{position:fixed;inset:0;background:#000c;z-index:56;display:none;align-items:center;justify-content:center;padding:10px}
#cpick .nbox{background:linear-gradient(180deg,#164878,#0d2b4b);border:3px solid var(--gold);border-radius:20px;padding:14px;width:100%;max-width:520px;max-height:94vh;overflow:auto;text-align:center}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:6px}
.cbtn{background:#ffffff14;box-shadow:none;padding:8px;font-size:.85em;display:flex;align-items:center;gap:6px;text-align:left}
.cbtn span{font-size:1.6em}
.trfx{position:absolute;inset:0;pointer-events:none;display:flex;align-items:center;justify-content:center}
.trfx div{position:absolute;top:18%;font-family:"Lilita One",sans-serif;font-size:2.4em;text-shadow:0 3px 0 #000a,0 0 18px #000a;animation:pop 1.4s ease-out forwards;white-space:nowrap}
.ng3d{position:relative}
.lastrep{background:#fff;color:#123;border-radius:12px;padding:6px 10px;margin-top:8px;font-size:.9em;animation:fadein .3s}
.trfade{position:absolute;inset:0;background:#000;pointer-events:none;opacity:0}
.trfade.on{animation:trf .6s ease-out}
@keyframes trf{0%{opacity:1}100%{opacity:0}}
.pitch3d{width:100%;aspect-ratio:720/460;position:relative;background:#0e2a47}
.pitch3d canvas{display:block;width:100%!important;height:100%!important}
/* player cards */
.pc{--tx:#2a1a05;--sub:#2a1a0599;--bd:#00000033;--stb:#ffffff40;position:relative;overflow:hidden;border-radius:26px 26px 16px 16px;padding:26px 12px 12px;color:var(--tx);border:3px solid var(--bd);box-shadow:0 8px 18px #0008,inset 0 0 0 2px #ffffff55}
.pc:before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.35;background:repeating-linear-gradient(135deg,transparent 0 10px,#ffffff22 10px 11px)}
.pc-shine{position:absolute;top:-60%;left:-80%;width:60%;height:220%;transform:rotate(25deg);background:linear-gradient(90deg,transparent,#ffffff88,transparent);pointer-events:none;animation:shine 4.5s ease-in-out infinite}
@keyframes shine{0%,60%{left:-80%}100%{left:140%}}
.pc-tier{position:absolute;top:0;left:50%;transform:translateX(-50%);padding:2px 16px 3px;border-radius:0 0 12px 12px;font-family:"Lilita One";font-size:.78em;letter-spacing:2px;background:#0000004d;color:#fff;text-shadow:0 1px 2px #0008;z-index:1}
.pc .xi{position:absolute;top:6px;right:10px;background:#1c1300;color:var(--gold);border-radius:999px;padding:1px 8px;font-size:.7em;font-weight:900;z-index:2}
.pc-head{display:flex;align-items:center;justify-content:space-between;position:relative;z-index:1}
.pc-ovr{display:flex;flex-direction:column;align-items:center;min-width:56px;line-height:1}
.pc-ovr b{font-family:"Lilita One";font-weight:400;font-size:2.6em;text-shadow:0 2px 0 #ffffff55}
.pc-ovr i{font-style:normal;font-size:1.3em;margin-top:2px}
.pc-av{flex:1;display:flex;justify-content:center;filter:drop-shadow(0 4px 4px #0006)}
.pc-name{font-family:"Lilita One";font-size:1.25em;text-align:center;margin-top:4px;line-height:1.05;position:relative;z-index:1}
.pc-meta{font-size:.74em;text-align:center;color:var(--sub);position:relative;z-index:1}
.pc-meta .pot{color:inherit}
.pc-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-top:8px;position:relative;z-index:1}
.pc-stats .st{background:var(--stb);border-radius:9px;text-align:center;padding:3px 0}
.pc-stats .st b{display:block;font-family:"Lilita One";font-weight:400;font-size:1.25em;line-height:1}
.pc-stats .st span{font-size:.62em;font-weight:900;opacity:.75}
.pc-stats .st.up b{color:#0b7a3c}.pc-stats .st.down b{color:#b3121c}
.pc .en{position:relative;z-index:1}.pc .gb{position:relative;z-index:1;font-size:.76em;text-align:center}
.pc .act{display:flex;gap:6px;margin-top:8px;position:relative;z-index:1}
.t-bronze{background:linear-gradient(160deg,#f6d2ad,#cd8448 48%,#7b4421);--bd:#5a3015}
.t-silver{background:linear-gradient(160deg,#ffffff,#d3dbe6 45%,#7d8b9e);--bd:#5b6676}
.t-gold{background:linear-gradient(160deg,#fff6c2,#f2c230 45%,#a8770a);--bd:#7a5606;box-shadow:0 8px 18px #0008,0 0 12px #ffd54a66,inset 0 0 0 2px #ffffff66}
.t-diamond{background:radial-gradient(circle at 20% 15%,#ffffff 0 6%,transparent 7%),radial-gradient(circle at 80% 30%,#ffffffcc 0 3%,transparent 4%),radial-gradient(circle at 65% 85%,#ffffffaa 0 2.5%,transparent 3.5%),linear-gradient(160deg,#f1fdff,#9ee8ff 40%,#3aa7d9 75%,#1d6fa5);--tx:#06263d;--sub:#06263dbb;--bd:#1b7fb0;box-shadow:0 8px 18px #0008,0 0 18px #8fe3ffaa,inset 0 0 0 2px #ffffffaa}
.t-ruby{background:radial-gradient(circle at 30% 20%,#ff8fa3,transparent 45%),linear-gradient(160deg,#ff5f7e,#d7143a 45%,#6d0618);--tx:#fff;--sub:#ffffffcc;--bd:#4a0210;--stb:#00000033;box-shadow:0 8px 18px #0008,0 0 20px #ff3b5caa,inset 0 0 0 2px #ffffff55}
.t-legend{background:radial-gradient(circle at 15% 20%,#fff 0 1%,transparent 1.5%),radial-gradient(circle at 70% 12%,#fff 0 .8%,transparent 1.3%),radial-gradient(circle at 85% 60%,#fff 0 1%,transparent 1.5%),radial-gradient(circle at 30% 75%,#ffffffcc 0 .8%,transparent 1.3%),radial-gradient(circle at 60% 40%,#c77dff88,transparent 50%),linear-gradient(160deg,#7b2ff7,#3a0ca3 50%,#10002b);--tx:#fff;--sub:#ffffffcc;--bd:#e0aaff;--stb:#ffffff22;box-shadow:0 8px 18px #0008,0 0 22px #b15cffcc,inset 0 0 0 2px #e0aaff88}
.t-icon{background:linear-gradient(120deg,#ff6b6b,#ffd93d,#6bff95,#4dd4ff,#c86bff,#ff6b6b);background-size:300% 300%;animation:rainbow 6s linear infinite;--tx:#1a1033;--sub:#1a1033cc;--bd:#ffffff;--stb:#ffffff66;box-shadow:0 8px 18px #0008,0 0 26px #ffffffcc,inset 0 0 0 3px #ffffffcc}
@keyframes rainbow{0%{background-position:0% 50%}100%{background-position:300% 50%}}
.t-ruby .pc-stats .st.up b,.t-legend .pc-stats .st.up b{color:#8dffb6}.t-ruby .pc-stats .st.down b,.t-legend .pc-stats .st.down b{color:#ffd0d6}
.t-ruby .pc-ovr b,.t-legend .pc-ovr b{text-shadow:0 2px 6px #0008}

<script>

 {short:'F4',name:'Flight 4',base:[40,42,43,45,46,48,50,51,53,54,56],pool:['Laguna Beach','Irvine','Tustin','Lake Forest','Costa Mesa','Orange','Anaheim','Fullerton','Aliso Viejo','Laguna Hills','Dana Point','San Clemente','Seal Beach','Cypress','Buena Park','Westminster']},

 {short:'Half NT',name:'Half National Team League',base:[67,68,70,72,73,74,76,78,79,80,82],pool:['Boston','Dallas','Miami','Chicago','Denver','Atlanta','New York','Houston','Philadelphia','Detroit','Minneapolis','Nashville','Orlando','Charlotte','St. Louis','Kansas City']},
 {short:'Full NT',name:'Full National Team League',base:[72,74,75,76,78,80,81,82,84,86,87],pool:['Team USA East','Team USA West','Team USA North','Team USA South','Liberty','Capital','Golden Gate','Empire State','Lone Star','Sunshine State','Great Lakes','Rocky Mountain','Pacific Coast','Atlantic Coast','Big Sky','Heartland']}];

const TEAM_IDEAS=['Laguna Beach','Irvine','Newport Beach','Huntington Beach','Mission Viejo','Costa Mesa','Tustin','San Clemente'];
function levelTeams(L){const mine=(S.teamName||'').toLowerCase();const cities=shuffle(L.pool).filter(c=>!mine.startsWith(c.toLowerCase())).slice(0,TEAMS_PER-1);const suf=shuffle(SUFFIX);
 return cities.map((c,i)=>L.short==='Full NT'&&c.startsWith('Team USA')?c:c+' '+suf[i])}
const WC_TEAMS=[['Brazil Samba Stars','#f9d71c'],['Spain Royal FC','#c60b1e'],['Germany Iron Eagles','#eeeeee'],['Argentina Tango','#74acdf'],['France Blue Roosters','#1f3a93'],['England Lions','#ffffff'],['Japan Blue Samurai','#1b3f8b'],['Italy Azzurri','#2a7de1'],['Portugal Navigators','#a3001b'],['Netherlands Orange','#ff7f00']];
const WC_BASE=[80,83,86,89];
const COUNTRIES='US:USA|AR:Argentina|BR:Brazil|MX:Mexico|CA:Canada|FR:France|ES:Spain|DE:Germany|IT:Italy|PT:Portugal|NL:Netherlands|BE:Belgium|HR:Croatia|GB-ENG:England|GB-SCT:Scotland|GB-WLS:Wales|IE:Ireland|DK:Denmark|SE:Sweden|NO:Norway|FI:Finland|IS:Iceland|PL:Poland|CZ:Czechia|SK:Slovakia|AT:Austria|CH:Switzerland|HU:Hungary|RS:Serbia|SI:Slovenia|BA:Bosnia|AL:Albania|GR:Greece|TR:Turkey|RO:Romania|BG:Bulgaria|UA:Ukraine|GE:Georgia|UY:Uruguay|CO:Colombia|CL:Chile|PE:Peru|EC:Ecuador|PY:Paraguay|VE:Venezuela|BO:Bolivia|CR:Costa Rica|PA:Panama|HN:Honduras|SV:El Salvador|GT:Guatemala|JM:Jamaica|HT:Haiti|TT:Trinidad and Tobago|CU:Cuba|DO:Dominican Republic|JP:Japan|KR:South Korea|CN:China|AU:Australia|NZ:New Zealand|SA:Saudi Arabia|IR:Iran|QA:Qatar|AE:UAE|IQ:Iraq|JO:Jordan|UZ:Uzbekistan|IN:India|ID:Indonesia|TH:Thailand|VN:Vietnam|PH:Philippines|MY:Malaysia|MA:Morocco|SN:Senegal|NG:Nigeria|GH:Ghana|CM:Cameroon|CI:Ivory Coast|EG:Egypt|TN:Tunisia|DZ:Algeria|ZA:South Africa|ML:Mali|BF:Burkina Faso|CD:DR Congo|KE:Kenya|UG:Uganda|ET:Ethiopia|CV:Cape Verde|IL:Israel|LB:Lebanon|KZ:Kazakhstan|AM:Armenia|AZ:Azerbaijan|MT:Malta|CY:Cyprus|LU:Luxembourg|EE:Estonia|LV:Latvia|LT:Lithuania|MK:North Macedonia|ME:Montenegro|MD:Moldova|FJ:Fiji|PG:Papua New Guinea|NP:Nepal|BD:Bangladesh|PK:Pakistan|LK:Sri Lanka|MN:Mongolia|SG:Singapore'.split('|').map(x=>{const[c,n]=x.split(':');return{c,n,f:flagOf(c)}});
function flagOf(c){if(c.startsWith('GB-')){const t={'GB-ENG':'eng','GB-SCT':'sct','GB-WLS':'wls'}[c];return '\u{1F3F4}'+[...('gb'+t)].map(ch=>String.fromCodePoint(0xE0000+ch.charCodeAt(0))).join('')+'\u{E007F}'}
 return String.fromCodePoint(...[...c].map(ch=>127397+ch.charCodeAt(0)))}
const inWC=()=>S&&S.phase==='wc'&&S.country;
const TN=()=>inWC()?S.country.f+' '+S.country.n:S.teamName;
const myCrest=sz=>inWC()?`<div style="font-size:${sz*.8}px;line-height:1">${S.country.f}</div>`:crest(S.teamName,S.color,sz);
function pickCountry(){let el=$('#cpick');if(!el){el=document.createElement('div');el.id='cpick';document.body.appendChild(el)}
 el.innerHTML=`<div class="nbox"><h2>🌍 Pick your country!</h2><p class="muted">At the World Cup, your team plays as a country. Which one?</p>
  <input type="text" id="cq" placeholder="Search…" oninput="cFilter(this.value)" style="margin-bottom:8px"><div class="cgrid" id="cgrid"></div></div>`;el.style.display='flex';cFilter('')}
function cFilter(q){q=q.toLowerCase();$('#cgrid').innerHTML=COUNTRIES.filter(c=>c.n.toLowerCase().includes(q)).map(c=>`<button class="cbtn" onclick="setCountry('${c.c}')"><span>${c.f}</span>${esc(c.n)}</button>`).join('')}
function setCountry(code){const c=COUNTRIES.find(x=>x.c===code);if(!c)return;S.country=c;
 if(S.wc){const others=shuffle(COUNTRIES.filter(x=>x.c!==code));S.wc.opps.forEach((o,i)=>{if(o.res)return;const k=others[i];o.name=k.f+' '+k.n});(S.wc.grp||[]).forEach((o,i)=>{if(o.res)return;const k=others[4+i];o.name=k.f+' '+k.n});if(!S.wc.gDone)S.wc.field=null}
 save();$('#cpick').style.display='none';render();confetti(150);toast(`${c.f} You are ${c.n} at the World Cup!`)}
const WC_ROUNDS=['Round of 16','Quarterfinal','Semifinal','FINAL'];
const wcStage=()=>S.wc&&S.wc.stage||'ko';
const wcLabel=()=>{const st=wcStage();return st==='group'?'Group match '+(S.wc.gi+1)+' of 2':st==='revive'?'Revive match':WC_ROUNDS[S.wc.round]};
function wcMk(i,k){return{name:k.f+' '+k.n,col:['#e63946','#2a9d8f','#e9c46a','#457b9d','#9b5de5','#f4a261'][i%6],str:wcStr(0)}}
function startWC(){S.phase='wc';S.wcc=true;const gp=shuffle(COUNTRIES.slice());S.wc={stage:'group',gi:0,pts:0,gf:0,ga:0,out:[],field:null,round:0,grp:[wcMk(0,gp[0]),wcMk(1,gp[1])],opps:shuffle(WC_TEAMS).slice(0,4).map(([n,c],i)=>{const o={name:n,col:c,str:wcStr(i)};ensureSquad(o);return o})};S.wc.grp.forEach(ensureSquad)}
function setupCountryLeague(){const cs=shuffle(COUNTRIES.slice()).slice(0,3);const teams=[{name:S.teamName,str:0,col:S.color}].concat(cs.map((c,i)=>({name:c.f+' '+c.n,str:clamp(wcStr(0)-4+i*2,30,95),col:['#e63946','#2a9d8f','#457b9d'][i]})));
 teams.forEach(t=>Object.assign(t,{p:0,w:0,d:0,l:0,gf:0,ga:0,pts:0}));S.league={teams,fixtures:makeFixtures(teams.length).slice(0,3),round:0,country:true};S.phase='league';S.wc=null;S.week=1}
function wcField(){const W=S.wc;if(W.field)return W.field;W.out=W.out||[];const used=new Set([...W.opps.map(o=>o.name),...(W.grp||[]).map(o=>o.name)]);
 const fill=shuffle(COUNTRIES.filter(c=>!S.country||c.c!==S.country.c).map(c=>({name:c.f+' '+c.n,col:'#cfd8dc'})).filter(t=>!used.has(t.name)));
 const N=W.stage?24:16,f=[{name:TN(),me:true,col:S.color,g:0}];
 (W.grp||[]).forEach(o=>f.push({name:o.name,col:o.col,g:0}));
 const rest=W.opps.map(o=>({name:o.name,col:o.col,prot:true}));for(const t of fill){if(f.length+rest.length>=N)break;rest.push({name:t.name,col:t.col})}
 rest.forEach((t,i)=>{t.g=1+(i%7);f.push(t)});W.field=f;return f}
function wcAliveOthers(){const W=S.wc;return wcField().filter(t=>!t.me&&!W.out.includes(t.name))}
function wcKill(n,prot){const cand=shuffle(wcAliveOthers().filter(t=>!t.prot||!prot||!prot.has(t.name)));cand.slice(0,n).forEach(t=>S.wc.out.push(t.name))}
function wcResolveGroup(){const W=S.wc,f=wcField(),[a,b]=W.grp;const sa=a.str,sb=b.str;const ga=pois(clamp(1.25*Math.pow(sa/sb,EXP),.05,6)),gb=pois(clamp(1.25*Math.pow(sb/sa,EXP),.05,6));
 const row=o=>{const r=o.gres||[0,0];return{o,pts:r[1]>r[0]?3:r[1]===r[0]?1:0,gd:r[1]-r[0],gf:r[1]}};
 const A=row(a),B=row(b);A.gf+=ga;A.gd+=ga-gb;B.gf+=gb;B.gd+=gb-ga;if(ga>gb)A.pts+=3;else if(ga<gb)B.pts+=3;else{A.pts++;B.pts++}
 const T=[{me:true,pts:W.pts,gd:W.gf-W.ga,gf:W.gf},A,B].map(t=>Object.assign(t,{r:Math.random()}));
 T.sort((x,y)=>y.pts-x.pts||y.gd-x.gd||y.gf-x.gf||y.r-x.r);const rank=T.findIndex(t=>t.me);const adv=rank<2;
 const keep=new Set();T.slice(0,2).forEach(t=>{if(!t.me)keep.add(t.o.name)});
 for(let g=1;g<=7;g++){const m=f.filter(t=>t.g===g);m.sort((x,y)=>(y.prot?1:0)-(x.prot?1:0)||Math.random()-.5);m.slice(0,2).forEach(t=>keep.add(t.name))}
 W.out=f.filter(t=>!t.me&&!keep.has(t.name)).map(t=>t.name);W.gDone=true;W.rank=rank+1;return adv}
function wcGroupHtml(){const W=S.wc;if(!W.stage)return'';return `<div class="card"><h2>🌍 Group stage</h2><div class="muted">2 small matches. A draw is okay! Finish top 2 to go on. If you lose, you get one revive match.</div><div class="bracket">${W.grp.map((o,i)=>`<div class="br ${W.stage==='group'&&i===W.gi?'now':''}">${crest(o.name,o.col||'#ddd',26)}<span class="sp">${esc(o.name)} (${o.str})</span><span>${o.res||(W.stage==='group'&&i===W.gi?'⏳ next':'🔒')}</span></div>`).join('')}${W.rev?`<div class="br ${W.stage==='revive'?'now':''}"><b style="min-width:100px">Revive match</b>${crest(W.rev.name,W.rev.col||'#ddd',26)}<span class="sp">${esc(W.rev.name)} (${W.rev.str})</span><span>${W.rev.res||'⏳ next'}</span></div>`:''}</div><p>Points: <b>${W.pts}</b></p></div>`}
function wcMapHtml(){const W=S.wc,f=wcField();return `<div class="card"><h2>🗺️ World Cup map</h2><div class="wcmap">${f.map(t=>{const out=t.me?!!W.meOut:W.out.includes(t.name);return `<div class="wct ${out?'out':''} ${t.me?'me':''}">${crest(t.name,t.col||'#ddd',34)}<span>${esc(t.name)}</span>${out?'<em>ELIMINATED</em>':t.me&&wcStage()==='revive'?'<em class="rv">REVIVE MATCH</em>':''}</div>`}).join('')}</div></div>`}

const DIFF={easy:4,normal:7,hard:9};
const COLORS=['#1d6fe0','#e0393e','#18a457','#ff9f1c','#7b2ff7','#111827'];
const HOURS=5; // training hours per training day
const DAY_MS=60000,TRAIN_DAYS=2; // each day lasts 1 minute; 2 training days, then match day
const EXP=6; // how much team strength matters (higher = the better team wins more)
let S=null,M=null,timer=null,anim=null,setupColor=COLORS[0],setupDiff='easy';

const rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=rnd(0,i);[a[i],a[j]]=[a[j],a[i]]}return a};
const $=s=>document.querySelector(s);
const esc=t=>String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=k=>(k<0?'-':'')+'$'+Math.abs(Math.round(k))+'k';
const initials=n=>n.split(/\s+/).map(w=>w[0]).join('').slice(0,3).toUpperCase();

function save(){try{localStorage.setItem('soccerMgrSave',JSON.stringify(S))}catch(e){}}
function load(){try{const t=localStorage.getItem('soccerMgrSave');if(t)S=JSON.parse(t)}catch(e){S=null}
 if(S&&(S.v||0)<3){S.v=3;S.diff=S.diff||'easy';S.color=S.color||COLORS[0];S.level=0;
  S.players.forEach(p=>p.energy=Math.max(p.energy,70));setupLeague();S.trials=S.trials||[];S.migrated=true;save()}
 if(S&&S.v<5){S.v=5;S.league.teams.forEach((t,i)=>{if(i>0)t.str=leagueStr(i-1)});if(S.wc)S.wc.opps.forEach((o,i)=>o.str=wcStr(i));save()}}

function leagueStr(i){return clamp(LEVELS[S.level].base[i]+DIFF[S.diff]+rnd(-1,1),30,92)}
function wcStr(i){return clamp(WC_BASE[i]+DIFF[S.diff],40,95)}
const money2=k=>Math.round(k*(1+S.level*.5));
function ladder(){return `<div class="ladder">${LEVELS.map((L,i)=>`<div class="step ${i<S.level?'done':i===S.level?'now':''}">${i===TOP?'⭐ ':''}${L.short}</div>`).join('<span class="arr">›</span>')}</div>`}
function trophyIcon(t){return t.type==='wc'?'🌍':t.type==='goal'?'⭐':'🏆'}
function trophyName(t){return t.name||(t.type==='wc'?'World Cup':'America League')}

function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('show'),2800)}
function modal(html,btns){const m=$('#modal');m.innerHTML=`<div class="box">${html}<div class="btns"></div></div>`;const b=m.querySelector('.btns');
 (btns||[{t:'OK',c:'gold'}]).forEach(x=>{const e=document.createElement('button');e.textContent=x.t;if(x.c)e.className=x.c;e.onclick=()=>{m.classList.add('hide');x.f&&x.f()};b.appendChild(e)});m.classList.remove('hide')}

/* confetti */
function confetti(n=160){const c=$('#confetti'),x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;
 const cols=['#ffc83d','#ff7a7a','#5cf29a','#3fa0ff','#ffffff',S?S.color:'#fff'];
 const ps=[...Array(n)].map(()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height*.5,vx:(Math.random()-.5)*4,vy:2+Math.random()*4,r:Math.random()*6.28,s:5+Math.random()*6,c:pick(cols)}));
 let f=0;(function step(){x.clearRect(0,0,c.width,c.height);ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.05;p.r+=.15;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);x.restore()});
  if(++f<220)requestAnimationFrame(step);else x.clearRect(0,0,c.width,c.height)})()}

/* svg bits */
function crest(name,col,size=58){const fm=String(name).match(/^((?:\u{1F3F4}[\u{E0061}-\u{E007A}]+\u{E007F})|(?:[\u{1F1E6}-\u{1F1FF}]{2}))/u);if(fm)return `<div style="font-size:${size*.8}px;line-height:1.15">${fm[1]}</div>`;return `<svg width="${size}" height="${size*1.15}" viewBox="0 0 100 115"><path d="M50 4 L94 16 V54 C94 82 74 101 50 111 C26 101 6 82 6 54 V16 Z" fill="${col}" stroke="#fff" stroke-width="6"/>
 <path d="M50 14 L84 23 V54 C84 76 69 91 50 99 Z" fill="#ffffff22"/><circle cx="50" cy="44" r="13" fill="#fff"/><path d="M50 33 l6 4 -2 7 h-8 l-2 -7z" fill="#222"/>
 <text x="50" y="86" text-anchor="middle" font-family="Lilita One,sans-serif" font-size="22" fill="#fff">${esc(initials(name))}</text></svg>`}
function jersey(col,num,size=46){return `<svg width="${size}" height="${size}" viewBox="0 0 100 100"><path d="M30 8 L42 4 Q50 14 58 4 L70 8 L96 26 L84 46 L74 40 V94 H26 V40 L16 46 L4 26 Z" fill="${col}" stroke="#1c1300" stroke-width="4" stroke-linejoin="round"/>
 <text x="50" y="74" text-anchor="middle" font-family="Lilita One,sans-serif" font-size="36" fill="#fff" stroke="#1c1300" stroke-width="2">${num}</text></svg>`}

function newName(){for(let i=0;i<800;i++){const n=pick(FIRST)+' '+pick(LAST);if(!S.usedNames.includes(n)){S.usedNames.push(n);return n}}const n='Player #'+S.nextId;S.usedNames.push(n);return n}

function ovrAt(p,pos){const s=p.s;let v;

。もう一度テストを受けていい? §と週§で入るよ。","감독님! 생각해봤어요. 다시 테스트 받아도 될까요? §에 입단하고 주급 §로 할게요."],["Finish in the top 2 to move up: F4 → F3 → F2 → F1 → Half National Team → Full National Team","进入前2名就能升级:4级 → 3级 → 2级 → 1级 → 半国家队 → 完整国家队","Termina entre los 2 primeros para subir: L4 → L3 → L2 → L1 → Media Selección → Selección Completa","Termine dans les 2 premiers pour monter : D4 → D3 → D2 → D1 → Demi-équipe nationale → Équipe nationale complète","Fique entre os 2 primeiros para subir: D4 → D3 → D2 → D1 → Meia Seleção → Seleção Completa","Werde Erster oder Zweiter, um aufzusteigen: L4 → L3 → L2 → L1 → Halbe Nationalmannschaft → Volle Nationalmannschaft","上位2チームに入ると昇格:4部 → 3部 → 2部 → 1部 → ハーフ代表 → フル代表","상위 2팀이 되면 승격해요: 4부 → 3부 → 2부 → 1부 → 하프 대표팀 → 풀 대표팀"],["Play your team against a friend or another player online. It doesn't count for your flight.","让你的球队在线对战朋友或其他玩家。不计入你的联赛成绩。","Juega con tu equipo contra un amigo u otro jugador en línea. No cuenta para tu liga.","Fais jouer ton équipe contre un ami ou un autre joueur en ligne. Ça ne compte pas pour ta division.","Jogue com seu time contra um amigo ou outro jogador online. Não vale para a sua divisão.","Spiele online mit deinem Team gegen einen Freund oder einen anderen Spieler. Es zählt nicht für deine Liga.","友だちやほかのプレイヤーとオンラインで対戦しよう。リーグの成績には入らないよ。","친구나 다른 플레이어와 온라인으로 대결해요. 리그 성적에는 들어가지 않아요."],["Online play works in the game on felixplayground.com. Open it there to play a real person!","在线对战只能在 felixplayground.com 上的游戏里使用。在那里打开就能和真人对战!","El juego en línea funciona en felixplayground.com. ¡Ábrelo allí para jugar contra una persona real!","Le jeu en ligne fonctionne sur felixplayground.com. Ouvre-le là-bas pour jouer contre une vraie personne !","O jogo online funciona em felixplayground.com. Abra lá para jogar contra uma pessoa de verdade!","Online-Spiel funktioniert auf felixplayground.com. Öffne es dort, um gegen einen echten Menschen zu spielen!","オンライン対戦は felixplayground.com のゲームで遊べるよ。そこで開いて本物の人と対戦しよう!","온라인 플레이는 felixplayground.com 에서 할 수 있어요. 거기서 열어서 진짜 사람과 대결해요!"],["I'm sorry I got so mad last time... 😔 Can I still join? I'll do it for only § and § a week.","对不起,上次我太生气了…😔 我还能加入吗?只要 § 加每周 §。","Perdón por enojarme tanto la última vez... 😔 ¿Aún puedo unirme? Solo por § y § a la semana.","Désolé d'avoir été si en colère la dernière fois... 😔 Je peux encore rejoindre ? Seulement § et § par semaine.","Desculpe por ter ficado tão bravo da última vez... 😔 Ainda posso entrar? Só por § e § por semana.","Tut mir leid, dass ich letztes Mal so wütend war... 😔 Kann ich trotzdem beitreten? Nur für § und § pro Woche.","このあいだは怒ってごめん…😔 まだ入れる? §と週§だけでいいよ。","지난번에 너무 화내서 미안해요... 😔 아직 입단할 수 있을까요? §와 주급 §만 받을게요."],["Their forwards are fast (SPD §) and your defenders are slower (§). Put faster defenders in!","他们的前锋很快(速度 §),你的后卫较慢(§)。换上更快的后卫!","Sus delanteros son rápidos (VEL §) y tus defensas más lentos (§). ¡Pon defensas más rápidos!","Leurs attaquants sont rapides (VIT §) et tes défenseurs plus lents (§). Mets des défenseurs plus rapides !","Os atacantes deles são rápidos (VEL §) e seus zagueiros mais lentos (§). Coloque zagueiros mais rápidos!","Ihre Stürmer sind schnell (TMP §) und deine Verteidiger langsamer (§). Stelle schnellere Verteidiger auf!","相手のFWは速い(速さ§)のに、こちらのDFは遅い(§)。もっと速いDFを入れよう!","상대 공격수는 빨라요 (속도 §), 우리 수비수는 더 느려요 (§). 더 빠른 수비수를 넣어요!"],["You finished #§ in §. You need the top 2 to move up. You stay in § next season — try again!","你在 § 中排名第 §。需要前2名才能升级。下赛季你仍留在 § — 再试一次!","Terminaste #§ en §. Necesitas estar entre los 2 primeros para subir. La próxima temporada sigues en § — ¡inténtalo otra vez!","Tu as fini #§ en §. Il faut être dans les 2 premiers pour monter. Tu restes en § la saison prochaine — réessaie !","Você terminou em #§ na §. Precisa ficar entre os 2 primeiros para subir. Na próxima temporada continua na § — tente de novo!","Du wurdest #§ in §. Du musst Top 2 sein, um aufzusteigen. Nächste Saison bleibst du in § — versuch's nochmal!","§で#§位。昇格には上位2チームが必要。来シーズンも§にとどまるよ — もう一度チャレンジ!","§에 liminés de la Coupe du monde en §. Mais aller à la Coupe du monde, c'est génial !","Eliminados da Copa do Mundo nas §. Mesmo assim, chegar à Copa do Mundo é demais!","Im § aus der WM ausgeschieden. Trotzdem ist es toll, es zur WM geschafft zu haben!","ワールドカップの§で敗退。それでもワールドカップに出られたのはすごい!","월드컵 §에서 탈락했어요. 그래도 월드컵에 간 것만으로 대단해요!"],["= starting § (your best players are picked automatically). Salaries: $§k per week.","= 首发 § 人(自动选出你最强的球员)。工资:每周 $§k。","= titulares § (tus mejores jugadores se eligen automáticamente). Salarios: $§k por semana.","= titulaires § (tes meilleurs joueurs sont choisis automatiquement). Salaires : $§k par semaine.","= titulares § (seus melhores jogadores são escolhidos automaticamente). Salários: $§k por semana.","= Startelf § (deine besten Spieler werden automatisch gewählt). Gehälter: $§k pro Woche.","= スタメン§人(いちばん強い選手が自動で選ばれる)。給料:週$§k。","= 선발 §명 (가장 좋은 선수가 자동으로 뽑혀요). 급여: 주당 $§k."],["Their defenders (SPD §) are faster than your forwards (§). Try faster forwards.","他们的后卫(速度 §)比你的前锋(§)更快。试试更快的前锋。","Sus defensas (VEL §) son más rápidos que tus delanteros (§). Prueba con delanteros más rápidos.","Leurs défenseurs (VIT §) sont plus rapides que tes attaquants (§). Essaie des attaquants plus rapides.","Os zagueiros deles (VEL §) são mais rápidos que seus atacantes (§). Tente atacantes mais rápidos.","Ihre Verteidiger (TMP §) sind schneller als deine Stürmer (§). Versuche schnellere Stürmer.","相手のDF(速さ§)はこちらのFW(§)より速い。もっと速いFWを試そう。","상대 수비수 (속도 §)가 우리 공격수 (§)보다 빨라요. 더 빠른 공격수를 써봐요."],["Your goal: reach the Full National Team! Top 2 there go to the World Cup 🌍.","你的目标:进入完整国家队!那里的前2名可以去世界杯 🌍。","Tu meta: ¡llegar a la Selección Completa! Los 2 primeros de ahí van al Mundial 🌍.","Ton but : atteindre l'équipe nationale complète ! Les 2 premiers vont à la Coupe du monde 🌍.","Seu objetivo: chegar à Seleção Completa! Os 2 primeiros vão para a Copa do Mundo 🌍.","Dein Ziel: die Volle Nationalmannschaft erreichen! Die ersten 2 dort fahren zur WM 🌍.","目標はフル代表! そこで上位2チームがワールドカップへ 🌍。","목표는 풀 대표팀! 거기서 상위 2팀은 월드컵에 가요 🌍."],["\"I finished the trial and I'm ready! I want $§k to join, and $§k every week.\"","\"我完成试训了,准备好了!我想要 $§k 才加入,每周还要 $§k。\"","\"¡Terminé la prueba y estoy listo! Quiero $§k para unirme y $§k cada semana.\"","\"J'ai fini l'essai et je suis prêt ! Je veux $§k pour rejoindre et $§k chaque semaine.\"","\"Terminei o teste e estou pronto! Quero $§k para entrar e $§k toda semana.\"","\"Ich habe das Probetraining beendet und bin bereit! Ich will $§k zum Beitreten und $§k jede Woche.\"","「トライアル終わって準備OK! 入団には$§k、毎週$§kがほしい。」","\"테스트를 마치고 준비됐어요! 입단하려면 $§k, 매주 $§k를 원해요.\""],["You made the Half National Team! One more step to the Full National Team!","你进入了半国家队!离完整国家队只差一步!","¡Llegaste a la Media Selección! ¡Un paso más para la Selección Completa!","Tu as atteint la demi-équipe nationale ! Encore un pas vers l'équipe nationale complète !","Você chegou à Meia Seleção! Mais um passo para a Seleção Completa!","Du hast die Halbe Nationalmannschaft erreicht! Noch ein Schritt zur Vollen Nationalmannschaft!","ハーフ代表になった! フル代表まであと一歩!","하프 대표팀이 됐어요! 풀 대표팀까지 한 걸음 남았어요!"],["Their attack (§) is stronger than your defense (§). Try 🛡️ Defend or 5-3-2.","他们的进攻(§)比你的防守(§)强。试试 🛡️ 防守 或 5-3-2。","Su ataque (§) es más fuerte que tu defensa (§). Prueba 🛡️ Defensa o 5-3-2.","Leur attaque (§) est plus forte que ta défense (§). Essaie 🛡️ Défense ou 5-3-2.","O ataque deles (§) é mais forte que sua defesa (§). Tente 🛡️ Defesa ou 5-3-2.","Ihr Angriff (§) ist stärker als deine Verteidigung (§). Versuche 🛡️ Verteidigung oder 5-3-2.","相手の攻撃(§)はこちらの守り(§)より強い。🛡️ 守る か 5-3-2 を試そう。","상대 공격(§)이 우리 수비(§)보다 강해요. 🛡️ 수비 또는 5-3-2를 써봐요."],["Stay back. Hard to score on, but you attack less. Players stay fresh.","留在后面。很难被进球,但进攻变少。球员保持体力。","Quédate atrás. Es difícil que te marquen, pero atacas menos. Los jugadores se mantienen frescos.","Reste en arrière. Difficile à marquer, mais tu attaques moins. Les joueurs restent frais.","Fique atrás. Difícil sofrer gols, mas você ataca menos. Os jogadores ficam descansados.","Bleib hinten. Schwer zu treffen, aber du greifst weniger an. Die Spieler bleiben frisch.","後ろで守る。点を取られにくいけど攻撃は減る。選手は疲れにくい。","뒤에 머물러요. 골 먹기 어렵지만 공격이 줄어요. 선수들이 덜 지쳐요."],["Sign players in Trials, or call up a free kid from your youth team.","在试训里签下球员,或从青训队召一个免费的小球员。","Ficha jugadores en las Pruebas o convoca a un chico gratis de tu cantera.","Recrute des joueurs aux Essais ou appelle un jeune gratuit de ton équipe de jeunes.","Contrate jogadores nos Testes ou chame um garoto grátis da base.","Verpflichte Spieler im Probetraining oder hol einen kostenlosen Jugendspieler.","トライアルで選手と契約するか、ユースから無料で呼ぼう。","입단 테스트에서 선수를 영입하거나 유소년팀에서 무료로 불러요."],["Hold the middle and stay together. Good at attacking AND defending.","控制中场,紧密团结。攻守兼备。","Domina el medio y mantente unido. Bueno atacando Y defendiendo.","Tiens le milieu et reste groupé. Bon en attaque ET en défense.","Segure o meio e fique junto. Bom no ataque E na defesa.","Halte die Mitte und bleibt zusammen. Gut im Angriff UND in der Verteidigung.","中盤を守ってまとまろう。攻めも守りも得意。","중앙을 지키고 뭉쳐요. 공격도 수비도 잘해요."],["He leaves forever and can't play anymore. He will never come back.","他会永远离开,再也不能踢球。他再也不会回来。","Se va para siempre y ya no puede jugar. Nunca volverá.","Il part pour toujours et ne peut plus jouer. Il ne reviendra jamais.","Ele sai para sempre e não pode mais jogar. Nunca mais volta.","Er geht für immer und kann nicht mehr spielen. Er kommt nie zurück.","永久にいなくなり、もうプレーできません。二度と戻ってきません。","영원히 떠나고 더는 뛸 수 없어요. 다시는 돌아오지 않아요."],["A starter? You have better players than me... I don't believe you.","主力?你有比我更强的球员…我不信。","¿Titular? Tienes jugadores mejores que yo... No te creo.","Titulaire ? Tu as de meilleurs joueurs que moi... Je ne te crois pas.","Titular? Você tem jogadores melhores que eu... Não acredito.","Stammspieler? Du hast bessere Spieler als mich... Ich glaube dir nicht.","スタメン? 僕より上手い選手がいるじゃん…信じない。","선발이요? 저보다 잘하는 선수가 있잖아요... 못 믿겠어요."],["They play Attack: their back is a bit weaker. Counter-attack them!","他们踢进攻:后防稍弱。反击他们!","Juegan al Ataque: su defensa es un poco más débil. ¡Contraataca!","Ils jouent l'Attaque : leur arrière est plus faible. Contre-attaque !","Eles jogam no Ataque: a defesa é um pouco mais fraca. Contra-ataque!","Sie spielen Angriff: hinten sind sie schwächer. Kontere sie!","相手は攻めてくる:後ろは少し弱い。カウンターだ!","상대는 공격형: 뒤가 조금 약해요. 역습하세요!"],["Drag players to move them right now. Tap two players to swap them.","拖动球员可以立刻移动他们。点两个球员可以交换位置。","Arrastra jugadores para moverlos ahora mismo. Toca a dos jugadores para intercambiarlos.","Glisse les joueurs pour les déplacer tout de suite. Touche deux joueurs pour les échanger.","Arraste jogadores para movê-los agora mesmo. Toque em dois jogadores para trocá-los.","Zieh Spieler, um sie sofort zu bewegen. Tippe zwei Spieler an, um sie zu tauschen.","選手をドラッグすると今すぐ動かせるよ。2人をタップすると入れかわる。","선수를 끌어서 바로 옮길 수 있어요. 두 선수를 누르면 서로 바뀌어요."],["They look stronger. Sign a better player in Trials or train more!","他们看起来更强。去试训签个更好的球员,或多训练!","Parecen más fuertes. ¡Ficha un mejor jugador en las Pruebas o entrena más!","Ils ont l'air plus forts. Recrute un meilleur joueur aux Essais ou entraîne-toi plus !","Eles parecem mais fortes. Contrate um jogador melhor nos Testes ou treine mais!","Sie wirken stärker. Hol im Probetraining einen besseren Spieler oder trainiere mehr!","相手のほうが強そう。トライアルでいい選手を取るか、もっと練習しよう!","상대가 더 강해 보여요. 입단 테스트에서 더 좋은 선수를 영입하거나 더 훈련해요!"],["That's the goal! Now finish top 2 there to go to the World Cup 🌍.","这就是目标!现在在那里拿到前2名就能去世界杯 🌍。","¡Esa es la meta! Ahora termina entre los 2 primeros para ir al Mundial 🌍.","C'est le but ! Maintenant termine dans les 2 premiers pour aller à la Coupe du monde 🌍.","Esse é o objetivo! Agora fique entre os 2 primeiros para ir à Copa do Mundo 🌍.","Das ist das Ziel! Jetzt werde dort Top 2, um zur WM zu fahren 🌍.","これが目標だ! ここで上位2チームに入ればワールドカップへ 🌍。","바로 그 목표예요! 여기서 상위 2팀이 되면 월드컵에 가요 🌍."],["You start in Flight 4. Teams only play teams in the same flight.","你从第4级联赛开始。球队只和同一级的球队比赛。","Empiezas en la Liga 4. Los equipos solo juegan contra equipos de su misma liga.","Tu commences en Division 4. Les équipes ne jouent que contre les équipes de la même division.","Você começa na Divisão 4. Os times só jogam contra times da mesma divisão.","Du startest in Liga 4. Teams spielen nur gegen Teams derselben Liga.","あなたは4部リーグからスタート。同じリーグのチームとだけ試合します。","4부 리그에서 시작해요. 같은 리그 팀끼리만 경기해요."],["Hi coach! I'm Cruz Brooks. I'm good at Speed. I want $§k to join.","教练好!我是 Cruz Brooks。我擅长速度。我想要 $§k 才加入。","¡Hola entrenador! Soy Cruz Brooks. Soy bueno en velocidad. Quiero $§k para unirme.","Salut coach ! Je suis Cruz Brooks. Je suis fort en vitesse. Je veux $§k pour rejoindre.","Oi treinador! Eu sou Cruz Brooks. Sou bom em velocidade. Quero $§k para entrar.","Hallo Trainer! Ich bin Cruz Brooks. Ich bin gut im Tempo. Ich will $§k zum Beitreten.","監督、こんにちは! Cruz Brooksです。速さが得意。入団には$§kがほしい。","감독님 안녕하세요! 저는 Cruz Brooks예요. 속도를 잘해요. 입단하려면 $§k를 원해요."],["Tap the player coming off, then tap who comes on from the bench.","点击要下场的球员,再点替补席上要上场的球员。","Toca al jugador que sale y luego a quien entra desde el banquillo.","Touche le joueur qui sort, puis celui qui entre depuis le banc.","Toque no jogador que sai e depois em quem entra do banco.","Tippe den Spieler an, der rausgeht, dann den von der Bank, der reinkommt.","交代で出る選手をタップして、ベンチから入る選手をタップしてね。","나가는 선수를 누르고, 벤치에서 들어올 선수를 눌러요."],["You need top 2 to move up. Train hard and try again next season!","需要前2名才能升级。努力训练,下赛季再试!","Necesitas estar entre los 2 primeros para subir. ¡Entrena duro y vuelve a intentarlo la próxima temporada!","Il faut être dans les 2 premiers pour monter. Entraîne-toi dur et réessaie la saison prochaine !","Você precisa ficar entre os 2 primeiros para subir. Treine muito e tente de novo na próxima temporada!","Du musst Top 2 sein, um aufzusteigen. Trainiere hart und versuche es nächste Saison nochmal!","昇格には上位2チームが必要。しっかり練習して、来シーズンまたチャレンジ!","승격하려면 상위 2팀이어야 해요. 열심히 훈련하고 다음 시즌에 다시 도전해요!"],["Tip: on a phone, tap the 🎤 on your keyboard to say it out loud.","小提示:在手机上点键盘上的 🎤 就能说话输入。","Consejo: en el móvil, toca el 🎤 del teclado para decirlo en voz alta.","Astuce : sur téléphone, appuie sur le 🎤 du clavier pour le dire à voix haute.","Dica: no celular, toque no 🎤 do teclado para falar em voz alta.","Tipp: Tippe am Handy auf das 🎤 der Tastatur, um es laut zu sagen.","ヒント:スマホではキーボードの🎤をタップして声で入力できるよ。","팁: 폰에서는 키보드의 🎤를 눌러서 말로 입력할 수 있어요."],["\"I completed the trial! I want $§k to join, and $§k every week.\"","\"我完成试训了!我想要 $§k 才加入,每周还要 $§k。\"","\"¡Completé la prueba! Quiero $§k para unirme y $§k cada semana.\"","\"J'ai fini l'essai ! Je veux $§k pour rejoindre et $§k chaque semaine.\"","\"Terminei o teste! Quero $§k para entrar e $§k toda semana.\"","\"Ich habe das Probetraining geschafft! Ich will $§k zum Beitreten und $§k jede Woche.\"","「トライアル終わったよ! 入団には$§k、毎週$§kがほしい。」","\"테스트를 마쳤어요! 입단하려면 $§k, 매주 $§k를 원해요.\""],["Not enough for the World Cup this time. Try again next season!","这次没能进世界杯。下赛季再试!","No alcanzó para el Mundial esta vez. ¡Inténtalo de nuevo la próxima temporada!","Pas assez pour la Coupe du monde cette fois. Réessaie la saison prochaine !","Não deu para a Copa do Mundo desta vez. Tente de novo na próxima temporada!","Diesmal hat es nicht für die WM gereicht. Versuch's nächste Saison nochmal!","今回はワールドカップに届かなかった。来シーズンまたチャレンジ!","이번엔 월드컵에 못 갔어요. 다음 시즌에 다시 도전해요!"],["I really liked training with you! I'll join for § and § a week.","我真的很喜欢和你一起训练!我愿意以 § 加入,每周 §。","¡Me encantó entrenar contigo! Me uno por § y § a la semana.","J'ai adoré m'entraîner avec toi ! Je rejoins pour § et § par semaine.","Adorei treinar com você! Entro por § e § por semana.","Ich habe das Training mit dir geliebt! Ich komme für § und § pro Woche.","いっしょの練習、楽しかった! §と週§で入るよ。","같이 훈련해서 정말 좋았어요! §에 입단하고 주급 §로 할게요."],["Use the time: train your team and scout the other team below!","利用这段时间:训练你的球队,并在下面侦察对手!","Usa el tiempo: ¡entrena a tu equipo y explora al otro equipo abajo!","Profite du temps : entraîne ton équipe et observ function step(){if(P.paused)return;P.f++;if(P.skill){P.skill.f++;if(P.skill.f>90)P.skill=null}if(P.mode==='handshake')return handshakeStep();if(P.mode==='done')return;const b=P.ball;

 // ball
 if(b.fly){const F=b.fly;F.k++;const q=Math.min(1,F.k/F.dur),e=1-Math.pow(1-q,1.6);

 // players
