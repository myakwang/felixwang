<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#10181c">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Escape Online">
<title>Felix's Escape Rooms Online</title>
<style>
@font-face{font-family:"Patrick Hand";src:url("patrick-hand.woff2") format("woff2");font-display:swap}
:root{
  /* layout: one phone-width column. status bar, 3D room, pockets, caption. clues and locks open in a bottom sheet. */
  --ink:#10181c;
  --panel:#1b272d;
  --line:#32444c;
  --text:#e8e2d2;
  --dim:#9aa9ab;
  --brass:#e0a73a;
  --paper:#f1e6c8;
  --paperink:#2b241a;
  --good:#58c98a;
  --bad:#e5604d;
  --display:"Patrick Hand","Chalkboard SE","Comic Sans MS",cursive;
  --note:"Patrick Hand","Chalkboard SE","Comic Sans MS",cursive;
  --body:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--ink);color:var(--text);font-family:var(--body);font-size:16px;line-height:1.45;display:flex;justify-content:center}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible{outline:3px solid var(--brass);outline-offset:2px}
#app{position:fixed;inset:0}
.bar{position:fixed;left:0;right:0;top:0;z-index:3;display:flex;align-items:center;gap:8px;pointer-events:none;
  padding:max(8px,env(safe-area-inset-top)) max(10px,env(safe-area-inset-right)) 18px max(10px,env(safe-area-inset-left));
  background:linear-gradient(rgba(10,15,17,.78),rgba(10,15,17,0))}
.bar>*{pointer-events:auto}
.bar h1{text-shadow:0 1px 4px #000}
.bar h1{font-family:var(--display);font-weight:400;font-size:25px;letter-spacing:.04em;margin:0;flex:1;line-height:1.05}
.bar h1 small{display:block;font-family:var(--body);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--brass)}
.chip{background:rgba(27,39,45,.88);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:14px;min-height:40px}
#time{font-variant-numeric:tabular-nums;color:var(--dim);font-size:14px}
#stage{position:fixed;inset:0;overflow:hidden;background:#000}
#stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:default}
#joy{position:fixed;z-index:2;left:max(18px,env(safe-area-inset-left));bottom:max(22px,env(safe-area-inset-bottom));width:clamp(124px,19vmin,190px);height:clamp(124px,19vmin,190px);border-radius:50%;
  background:rgba(16,24,28,.4);border:2px solid rgba(232,226,210,.35);touch-action:none}
#knob{position:absolute;left:30%;top:30%;width:40%;height:40%;border-radius:50%;background:rgba(224,167,58,.85);pointer-events:none}
#keyhelp{position:fixed;z-index:2;left:max(14px,env(safe-area-inset-left));bottom:max(16px,env(safe-area-inset-bottom));display:none;background:rgba(16,24,28,.78);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-size:15px;line-height:1.7;pointer-events:none}
#xh{position:fixed;z-index:3;left:50%;top:50%;width:22px;height:22px;transform:translate(-50%,-50%);pointer-events:none;display:none}
#xh:before,#xh:after{content:'';position:absolute;background:#fff;box-shadow:0 0 3px #000;left:10px;top:0;width:2px;height:22px}#xh:after{left:0;top:10px;width:22px;height:2px}
#keyhelp.lk{opacity:.55}
#keyhelp kbd{display:inline-block;min-width:26px;text-align:center;background:var(--paper);color:var(--paperink);border-radius:5px;border-bottom:3px solid #b6a577;padding:0 6px;font-family:var(--display);font-size:16px;margin-right:3px}
#flash{position:fixed;inset:0;z-index:9;background:#fff;opacity:0;pointer-events:none}
@media (hover:hover) and (pointer:fine) and (min-width:820px){#cap{left:calc(50% + 150px)}}
#live{font-size:13px;color:#7be39b;background:rgba(10,30,18,.7);border-radius:10px;padding:1px 9px;margin-bottom:3px;display:none;width:max-content;max-width:100%}
#timer{position:fixed;z-index:4;left:50%;top:max(8px,env(safe-area-inset-top));transform:translateX(-50%);font-family:var(--display);font-size:26px;color:#ffd890;background:rgba(40,8,8,.85);border:2px solid #c0392b;border-radius:12px;padding:2px 16px;display:none}
#timer.low{background:#a01818;color:#fff;animation:tp .5s infinite alternate}@keyframes tp{to{transform:translateX(-50%) scale(1.12)}}
#toast{position:fixed;z-index:4;left:50%;top:max(64px,calc(env(safe-area-inset-top) + 56px));transform:translateX(-50%);background:rgba(16,24,28,.88);border:1px solid var(--brass);
  border-radius:8px;padding:8px 14px;font-size:15px;max-width:88%;text-align:center;opacity:0;transition:opacity .25s;pointer-events:none}
#toast.on{opacity:1}
#inv{position:fixed;z-index:2;right:max(8px,env(safe-area-inset-right));top:max(64px,calc(env(safe-area-inset-top) + 56px));width:50px;display:flex;flex-direction:column;align-items:center;gap:6px;
  padding:6px 0;background:rgba(27,39,45,.72);border:1px solid var(--line);border-radius:12px;font-size:20px}
#inv b{font-size:26px;font-weight:400;line-height:1.1}
#cap{position:fixed;z-index:2;left:50%;bottom:max(24px,env(safe-area-inset-bottom));transform:translateX(-50%);width:min(60vw,360px);margin:0;text-align:center;font-size:15px;
  color:var(--text);text-shadow:0 1px 4px #000,0 0 8px #000;pointer-events:none;transition:opacity .6s}
#veil{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-end;justify-content:center;z-index:10}
#veil.on{display:flex}
#sheet{width:100%;max-width:560px;max-height:88%;overflow:auto;background:var(--panel);border-top:3px solid var(--brass);border-radius:14px 14px 0 0;padding:16px 16px 24px;display:flex;flex-direction:column;gap:12px}
#sheet header{display:flex;align-items:center;gap:8px}
#sheet h2{font-family:var(--display);font-weight:400;font-size:24px;letter-spacing:.04em;margin:0;flex:1;text-wrap:balance}
#body{display:flex;flex-direction:column;gap:12px}
#body p{margin:0}
.paper{background:var(--paper);color:var(--paperink);font-family:var(--note);padding:14px;border-radius:3px;font-size:17px;box-shadow:0 3px 0 rgba(0,0,0,.3);transform:rotate(-.6deg);text-align:center}
.paper.big{font-size:25px;letter-spacing:.1em}
.mirror{background:linear-gradient(135deg,#b9d3dc,#e9f4f6 40%,#9fbac4);color:#1c2d33;font-family:var(--display);font-size:30px;letter-spacing:.1em;padding:22px 8px;text-align:center;border:6px solid #7b5a2c;border-radius:6px}
.mirror .m{display:inline-block;transform:scaleX(-1)}
.flip{transform:rotate(180deg)}
.canvas{background:#59605f;border:8px solid #7b5a2c;padding:18px 8px;text-align:center;border-radius:4px;color:#2f3433;font-size:15px}
.canvas .uv{font-size:34px;letter-spacing:.2em;color:#c9a6ff;text-shadow:0 0 12px #a6f;display:block;margin-top:8px}
.books{display:flex;gap:4px;justify-content:center;align-items:flex-end;background:#3a2a18;padding:12px 8px 0;border-bottom:8px solid #24190d;border-radius:4px}
.books span{width:34px;height:110px;border-radius:3px 3px 0 0;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:22px;color:rgba(0,0,0,.75);box-shadow:inset -4px 0 0 rgba(0,0,0,.2)}
.books span:nth-child(odd){height:96px}
.c-red{background:#d9463b}.c-blue{background:#3f7fd8}.c-yellow{background:#ecc63a}.c-green{background:#3fae62}.c-orange{background:#ea8a2e}.c-purple{background:#8c5fd0}
.rainbow{display:flex;flex-direction:column;border-radius:6px;overflow:hidden;border:6px solid var(--paper)}
.rainbow i{height:22px;display:block}
table.clues{border-collapse:collapse;width:100%;font-size:15px}
table.clues td{padding:8px 6px;border-bottom:1px solid var(--line)}
table.clues td:first-child{font-family:var(--display);font-size:24px;letter-spacing:.25em;color:var(--brass);white-space:nowrap}
.grid{display:grid;gap:4px;justify-content:center}
.grid span{width:44px;height:44px;background:#4c5356;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:24px;border-radius:4px}
.grid span.q{color:var(--brass);background:#2a3236}
.grid span.h{background:none;color:var(--dim);font-size:16px}
.pyr{display:flex;flex-direction:column;align-items:center;gap:4px}
.pyr div{display:flex;gap:4px}
.pyr span{width:52px;height:40px;background:#b89a5a;color:#2b241a;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:24px;border-radius:3px}
.disp{font-family:var(--display);font-size:34px;letter-spacing:.35em;text-align:center;background:#0a0f11;border:1px solid var(--line);border-radius:6px;padding:8px 0 8px .35em;min-height:62px;color:var(--good)}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.keys button,.btn{background:#26363d;border:1px solid var(--line);border-bottom-width:3px;border-radius:8px;min-height:50px;font-size:20px}
.btn{padding:0 16px;font-size:17px}
.btn.go{background:var(--brass);border-color:#a87a1f;color:#1d1503;font-weight:700}
.seq{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.seq.six{grid-template-columns:repeat(3,1fr)}
.seq button{min-height:60px;border-radius:8px;border:0;border-bottom:4px solid rgba(0,0,0,.35);font-size:26px;color:#111}
.seq button.arrow{background:#26363d;color:var(--text)}
.dots{display:flex;gap:6px;justify-content:center;min-height:14px}
.dots i{width:12px;height:12px;border-radius:50%;background:var(--line)}
.dots i.f{background:var(--brass)}
.lights{display:grid;grid-template-columns:repeat(3,72px);gap:8px;justify-content:center}
.lights button{height:72px;border-radius:50%;border:3px solid #0a0f11;background:#2a3236}
.lights button.on{background:radial-gradient(#fff7c2,#f2c230);box-shadow:0 0 18px #f2c23099}
.sw{display:flex;gap:8px;justify-content:center}
.sw button{width:44px;height:84px;border-radius:8px;border:1px solid var(--line);background:#0a0f11;position:relative}
.sw button::after{content:"";position:absolute;left:6px;right:6px;height:34px;bottom:6px;border-radius:5px;background:#55656c}
.sw button.on::after{bottom:auto;top:6px;background:var(--brass)}
input.word{width:100%;font:inherit;font-family:var(--display);font-size:28px;letter-spacing:.2em;text-transform:uppercase;text-align:center;background:#0a0f11;color:var(--good);border:1px solid var(--line);border-radius:6px;padding:10px}
.msg{min-height:1.4em;color:var(--bad);text-align:center;font-size:15px}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-7px)}50%{transform:translateX(7px)}75%{transform:translateX(-4px)}}
@media (prefers-reduced-motion:reduce){.shake{animation:none}#toast{transition:none}}
.rooms{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.rooms .btn{padding:0;font-size:16px;min-height:44px}
.rooms button[disabled]{opacity:.35;cursor:default}
.stat{font-family:var(--display);font-size:22px;color:var(--brass)}
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
input.word{-webkit-user-select:text;user-select:text}
#app,#stage,#joy{touch-action:none}
.touchy .chip{min-height:46px;font-size:16px;padding:8px 14px}
.touchy #inv{width:60px;gap:8px;padding:8px 0}.touchy #inv b{font-size:32px}.touchy #bpap{font-size:32px}
.touchy .keys button,.touchy .btn{min-height:56px}
.trophy{display:flex;justify-content:center;animation:tp2 1.6s ease-in-out infinite alternate}@keyframes tp2{to{transform:translateY(-6px) scale(1.04)}}
.shelf{display:flex;gap:6px;justify-content:space-around;align-items:flex-end;margin-top:14px;text-align:center}.shelf>div{display:flex;flex-direction:column;align-items:center;flex:1}.shelf small{font-size:12px;color:var(--dim);margin-top:4px}.shelf svg{max-width:100%;height:auto}
.modes{display:flex;flex-direction:column;gap:10px}.mode{text-align:left;line-height:1.3}.mode small{font-weight:400;opacity:.85;font-size:14px}.mode.cur{outline:3px solid var(--brass)}
.msg.good{color:var(--good)}
.sockets{display:flex;gap:14px;justify-content:center}
.sock{width:64px;height:64px;border-radius:50%;background:#0a0f11;border:3px solid #3a4a52;display:flex;align-items:center;justify-content:center;font-size:32px}
.sock.on{border-color:var(--brass);box-shadow:0 0 14px #e0a73a88}
.gems{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.gems button{width:68px;height:68px;border-radius:50%;font-size:34px;background:#26363d;border:1px solid var(--line)}
.cards{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;min-height:50px}
.cards button{background:var(--paper);color:var(--paperink);font-family:var(--note);font-size:21px;min-height:46px;padding:0 14px;border:0;border-bottom:4px solid #b6a577;border-radius:6px}
.rowb{display:flex;gap:8px}.rowb .btn{flex:1}
#bpap{background:none;border:0;font-size:26px;line-height:1;padding:4px 0 2px;position:relative;width:100%}
#pcount{position:absolute;right:3px;top:-2px;background:var(--brass);color:#1d1503;border-radius:9px;font:700 12px/16px var(--body);min-width:16px;padding:0 3px}
.strip{display:flex;flex-direction:column;gap:6px}.strip>small{color:var(--dim);font-size:13px;text-transform:uppercase;letter-spacing:.06em}
</style>
</head>
<body>
<div id="app">
  <div class="bar">
    <div id="live"></div>
    <h1><small id="rnum">Room 1 of 45</small><span id="rname">Broom Closet</span></h1>
    <span id="time">0:00</span>
    <button class="chip" id="bmode">Easy</button>
    <button class="chip" id="bhint">Hint</button>
    <button class="chip" id="brooms">Rooms</button>
    <button class="chip" id="bsnd" aria-label="Sound: music and effects on">🎵</button>
    <button class="chip" id="bhome" style="display:none" aria-label="All games">🏠</button>
  </div>
  <div id="stage"><canvas id="cv" aria-label="3D room. Drag to look around, tap things to search them."></canvas>
    </div>
  <div id="flash"></div>
  <div id="timer" aria-live="off"></div>
  <div id="toast" role="status"></div>
  <div id="xh"></div>
  <div id="keyhelp"><div><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> or arrow keys: walk</div><div><kbd>Q</kbd><kbd>E</kbd> turn</div><div>Click the game once: the mouse then looks around by itself (Esc lets go)</div><div>Click the + on things to open them, or on the floor to walk</div></div>
  <div id="joy" aria-label="Move. Drag to walk, or use the arrow keys."><div id="knob"></div></div>
  <div id="inv" aria-label="Pockets"><span aria-hidden="true">🎒</span><span id="items" style="display:contents"></span><button id="bpap" aria-label="Paper strips you have found">📜<span id="pcount"></span></button></div>
  <p id="cap"></p>
</div>
<div id="veil"><div id="sheet" role="dialog" aria-modal="true">
  <header><h2 id="stitle"></h2><button class="chip" id="sclose">Close</button></header>
  <div id="body"></div>
</div></div>

<script src="three.min.js"></script>
<script id="data">
/* ---------- clues ---------- */
const note=(t,big)=>`<div class="paper${big?' big':''}">${t}</div>`;
function clockSvg(h,m,nums){ let t=''; for(let i=0;i<12;i++){const a=i*Math.PI/6; t+=`<line x1="${50+38*Math.sin(a)}" y1="${50-38*Math.cos(a)}" x2="${50+43*Math.sin(a)}" y2="${50-43*Math.cos(a)}" stroke="#2b241a" stroke-width="${i%3?1:2.5}"/>`;}
  const P=(a,r)=>`x2="${50+r*Math.sin(a*Math.PI/180)}" y2="${50-r*Math.cos(a*Math.PI/180)}"`;
  const n=nums?'<text x="50" y="20" text-anchor="middle" font-size="9">12</text><text x="83" y="53" text-anchor="middle" font-size="9">3</text><text x="50" y="87" text-anchor="middle" font-size="9">6</text><text x="17" y="53" text-anchor="middle" font-size="9">9</text>':'';
  return `<svg viewBox="0 0 100 100" style="width:200px;align-self:center;display:block;margin:auto" role="img" aria-label="A clock face"><circle cx="50" cy="50" r="46" fill="#f1e6c8" stroke="#7b5a2c" stroke-width="4"/>${t}${n}<line x1="50" y1="50" ${P(h,22)} stroke="#2b241a" stroke-width="4" stroke-linecap="round"/><line x1="50" y1="50" ${P(m,34)} stroke="#2b241a" stroke-width="2.4" stroke-linecap="round"/><circle cx="50" cy="50" r="3" fill="#2b241a"/></svg>`; }
const bk=a=>'<div class="books">'+a.map(b=>`<span class="c-${b[0]}">${b[1]||''}</span>`).join('')+'</div>';
const cbT=r=>'<table class="clues">'+r.map(x=>`<tr><td>${x[0]}</td><td>${x[1]}</td></tr>`).join('')+'</table>';
const CL={
 sky:note('🌙 ⭐ 🌙 ☀️ 🌙<br>⭐ 🌙 ☀️ ⭐ 🌙',1)+'<p>A hand-painted sky. Somebody counted very carefully.</p>',
 clock720:clockSvg(220,120,1)+'<p>The hands are frozen.</p>',
 n45:note('I always lock up 45 minutes after the clocks stop.'),
 books5:bk([['blue'],['red'],['yellow'],['green'],['blue']])+'<p>Five books, neatly lined up. Every other shelf is a mess.</p>',
 ltr:'<p>A card was under the vase.</p>'+note('Read left to right, like always.'),
 mirror:'<div class="mirror"><span class="m">SIX NINE TWO FIVE</span></div><p>Someone wrote on the glass with a finger. From the other side.</p>',
 count3:note('Count the stock every night:<br><br>BARRELS · VASES · CRATES'),
 plaque9:note('ALL NINE LAMPS LIT = SAFE OPENS'),
 dice:note('⚂ ⚅ ⚀',1)+'<p>Three dice were left on a table. The lock wants the numbers facing the table.</p>',
 dice7:'<p>A note was under the vase.</p>'+note('Opposite sides of a dice always add up to 7.'),
 books6:bk([['green',20],['purple',15],['red',5],['yellow',9],['blue',3],['orange',24]])+'<p>Six books with numbers on their spines.</p>',
 rainbow:'<div class="rainbow"><i class="c-red"></i><i class="c-orange"></i><i class="c-yellow"></i><i class="c-green"></i></div><p>Half a rainbow. The bottom was torn off.</p>',
 a1z26:'<p>A scroll was inside the vase.</p>'+note('A is 1.<br>B is 2.<br>Z is 26.<br><br>Read the rainbow.'),
 compass:note('N<br>W ✛ E<br>S',1)+'<p>An old compass. North is at the top.</p>',
 route:note('Captain’s route:<br><br>N, W, W, S, E, N',0),
 mix:note('🔴 + 🟡<br>🟡 + 🔵<br>🔵 + 🔴<br>🟡 + 🔴',1)+'<p>Mix each pair of paints. Press what you get.</p>',
 cb042:cbT([['682','One digit is right and in the right place.'],['614','One digit is right but in the wrong place.'],['206','Two digits are right but both in the wrong place.'],['738','Nothing is right.'],['780','One digit is right but in the wrong place.']]),
 cb573:cbT([['519','One digit is right and in the right place.'],['725','Two digits are right but both in the wrong place.'],['194','Nothing is right.'],['382','One digit is right but in the wrong place.'],['678','One digit is right and in the right place.']]),
 phone:'<div class="grid" style="grid-template-columns:repeat(3,64px)">'+['1','2 ABC','3 DEF','4 GHI','5 JKL','6 MNO','7 PQRS','8 TUV','9 WXYZ'].map(k=>`<span style="width:64px;font-size:16px">${k}</span>`).join('')+'</div><p>The buttons of a very old phone.</p>',
 truth:note('Only ONE label tells the truth.<br><br>Open the wrong chest and the floor opens instead.'),
 updown:'<div class="canvas flip"><div>THIS WAY UP ▲</div><span class="uv">↑ → ↓ ↓ ← ↑</span></div><p>In the torchlight, marks glow on the canvas. It was hung carelessly.</p>',
 fib:note('1, 1, 2, 3, 5, 8, ?, ?',1)+'<p>On the back: "the safe wants the two that are missing".</p>',
 zoo:note('🐱 + 🐶 = 10 kg<br>🐶 + 🐦 = 7 kg<br>🐱 + 🐦 = 9 kg',1)+'<p>The zookeeper weighed them two at a time.</p>',
 roman:note('MMXXVI − XLII',1)+'<p>Carved over the bath.</p>',
 romankey:'<p>A tile was under the vase.</p>'+note('I=1 &nbsp;V=5 &nbsp;X=10 &nbsp;L=50<br>C=100 &nbsp;D=500 &nbsp;M=1000<br><br>A small one in front of a big one is taken away.'),
 mclock:'<div class="mirror" style="padding:10px"><div class="m" style="display:block">'+clockSvg(250,120,0)+'</div></div><p>A clock, seen in the mirror.</p>',

    g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(v,t+Math.min(.02,d/3)); g.gain.exponentialRampToValueAtTime(.0001,t+d); o.connect(g); g.connect(dest||sfx); o.start(t); o.stop(t+d+.05); }

    fade('#fff',900,0);
  };
  cut={t:0,d:2.6,fx:px,fz:pz,fy:yaw,fp:pitch,tx:0,tz:-3.7,ty:0,tp:.04,end:finish};
}
$('#bhint').onclick=()=>{ const H=LV[S.lvl].hints, M=MD();
  if(M.hint<0) return sheet('Hint','<p>There are no hints in Hard mode. You can do it! You can switch to an easier mode with the Mode button.</p>');
  const pay=()=>{ if(M.hint&&tleft!==null){ tleft-=M.hint; lastSec=-1; toast('Hint used. -'+M.hint+' seconds.'); } };
  const show=i=>sheet(`Hint ${i+1} of ${H.length}`,`<p>${H[i]}</p>`+(S.mode!=='easy'?'<p><small>Things are in new places in this mode. Ignore words like “behind you” or “by the door”.</small></p>':'')+(i<H.length-1?'<button class="btn" id="more">I need a bigger hint</button>':''),
    el=>{const m=el.querySelector('#more'); if(m) m.onclick=()=>{ if(hintAt<i+2){hintAt=i+2;S.hints++;save();pay();} show(i+1); };});
  if(hintAt===0){hintAt=1;S.hints++;save();pay();} show(hintAt-1); };
/* Live count: an anonymous "still playing" signal (random id made fresh each time the game opens, never saved),
   sent once a minute while the game is on screen, with "g":"er". Nothing else is sent. Website only. */
let liveN=0;
const PLAY_ID=(()=>{ try{ const a=new Uint8Array(8); crypto.getRandomValues(a); return Array.from(a,b=>b.toString(16).padStart(2,'0')).join(''); }catch(e){ return null; } })();
function playBeat(bye){ if(!PLAY_ID||!ON_SITE) return; const body=JSON.stringify({id:PLAY_ID,bye:bye?1:0,g:'er'});
  try{ if(bye&&navigator.sendBeacon){ navigator.sendBeacon(location.origin+'/api/playing',new Blob([body],{type:'application/json'})); return; }
    fetch(location.origin+'/api/playing',{method:'POST',headers:{'content-type':'application/json'},body,keepalive:true}).catch(()=>{}); }catch(e){} }
async function readLive(){ if(!ON_SITE) return; try{ const r=await fetch(location.origin+'/api/online',{cache:'no-store'}); const j=await r.json(); liveN=Math.max(1,j.escape|0); showLive(); }catch(e){} }
function showLive(){ const el=$('#live'); if(!el||!liveN) return; el.style.display='block'; el.textContent=liveN<=1?'🟢 You are the only one playing!':'🟢 '+liveN+' playing now'; }
function modeLabel(){ $('#bmode').textContent=MD().name; }
$('#bmode').onclick=()=>sheet('Choose a mode','<div class="modes">'+['easy','medium','hard'].map(m=>`<button class="btn go mode${S.mode===m?' cur':''}" data-m="${m}"><b>${MODES[m].name}${S.mode===m?' (playing)':''}</b><br><small>${MODES[m].desc}</small></button>`).join('')+'</div>'+'<div class="shelf">'+['easy','medium','hard'].map(m=>`<div>${trophySvg(m,!S.tr[m])}<small>${S.tr[m]?TROPHY[m].name:'Finish all 45 rooms in '+MODES[m].name}</small></div>`).join('')+'</div><p style="color:var(--dim)">Each mode keeps its own progress. Easy is the original game.</p>',
  el=>el.querySelector('.modes').onclick=e=>{ const b=e.target.closest('button'); if(!b) return; S.mode=b.dataset.m; modeLabel(); save(); start(Math.min(S.lvl,S.mx[S.mode])); });
$('#brooms').onclick=()=>sheet('Rooms','<div class="rooms">'+LV.map((r,i)=>`<button class="btn" data-i="${i}" ${i>S.mx[S.mode]?'disabled':''} aria-label="Room ${i+1}${i>S.mx[S.mode]?' locked':''}">${i>S.mx[S.mode]?'🔒':i+1}</button>`).join('')+'</div><p style="color:var(--dim)">Clear a room to unlock the next one.</p>',
  el=>el.querySelector('.rooms').onclick=e=>{const b=e.target.closest('button'); if(b&&!b.disabled) start(+b.dataset.i);});
const fmt=ms=>{const s=Math.floor(ms/1000);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');};
setInterval(()=>{ if(!done&&!document.hidden){S.ms+=1000; $('#time').textContent=fmt(S.ms); if(S.ms%10000===0) save();} },1000);
$('#time').textContent=fmt(S.ms);
document.body.classList.toggle('touchy',TOUCH);
['gesturestart','gesturechange','gestureend'].forEach(ev=>document.addEventListener(ev,e=>e.preventDefault()));
if(!TOUCH){ $('#joy').style.display='none'; $('#keyhelp').style.display='block'; $('#cv').setAttribute('aria-label','3D room. Walk with W A S D or the arrow keys, move the mouse to look, click things.'); }
const ON_SITE=/^https?:$/.test(location.protocol)&&!/claude|anthropic/i.test(location.hostname);
if(ON_SITE){const h=$('#bhome');h.style.display='';h.onclick=()=>{location.href=new URL('../',location.href).href;};}
modeLabel();
try{ init3D(); start(Math.min(S.lvl||0,S.mx[S.mode],LV.length-1)); }
catch(e){ say('This device could not start the 3D view. Try another browser.',60000); }
</script>
<script>
/* Escape Rooms Online: the two-device layer. Two players talk through this site's own room relay at /api/room/<CODE>.
   Nicknames come from a fixed list and are sent as list positions only. Nothing is typed, stored or chatted.
   Messages: game moves (which things were opened or picked up), where each player stands, and race progress. */
window.OL=(function(){
const NICK_A=['Captain','Super','Mega','Turbo','Sneaky','Brave','Lucky','Speedy','Mighty','Cosmic','Silly','Ninja','Rocket','Thunder','Pixel','Sparkle'];
const NICK_B=['Comet','Star','Pencil','Giant','Dragon','Tiger','Shark','Wizard','Robot','Panda','Falcon','Knight','Bug Smasher','Taco','Volcano','Penguin'];
let myNick=[(Math.random()*NICK_A.length)|0,(Math.random()*NICK_B.length)|0];
try{ const v=JSON.parse(localStorage.getItem('escapeRoomOnlineName')||'null'); if(Array.isArray(v)&&NICK_A[v[0]]&&NICK_B[v[1]]) myNick=v; }catch(e){}
const nickText=n=>n&&NICK_A[n[0]]&&NICK_B[n[1]]?NICK_A[n[0]]+' '+NICK_B[n[1]]:null;
const CODE_ABC='ABCDEFGHJKMNPQRSTUVWXYZ';
const NET={ws:null,role:null,code:null,state:'idle',want:null,timer:0,friend:null};
const O={on:false,kind:null,goal:5,cleared:0,fc:0,fl:0,over:false,sent:{},silent:false,acc:0,acc2:0,fp:null,av:null,cfg:{k:'co',d:'easy',g:5}};
const fname=()=>nickText(NET.friend)||'Your friend';
const randCode=()=>{ let c=''; for(let i=0;i<4;i++) c+=CODE_ABC[(Math.random()*CODE_ABC.length)|0]; return c; };
function serverBase(){ let q=null; try{ q=new URLSearchParams(location.search).get('server'); }catch(e){} return (q||(/^https?:$/.test(location.protocol)?location.origin:'https://felixwang.pages.dev')).replace(/\/$/,''); }
function send(o){ if(NET.ws&&NET.ws.readyState===1){ try{ NET.ws.send(JSON.stringify(o)); }catch(e){} } }
function netClose(){ clearTimeout(NET.timer); NET.friend=null; const w=NET.ws; NET.ws=null; NET.state='idle'; O.on=false; hud(); if(O.av){ O.av.visible=false; } if(w){ try{ w.close(); }catch(e){} } }
const optStyle=document.createElement('style'); optStyle.textContent='.opt{margin:3px 4px 3px 0}.opt.cur{outline:3px solid var(--brass)}#olhud{position:fixed;z-index:4;left:50%;top:50px;transform:translateX(-50%);font-size:14px;color:#fff;background:rgba(20,40,60,.8);border:1px solid #6aa;border-radius:10px;padding:2px 12px;display:none;white-space:nowrap}#brooms{display:inline-block}#bmode{display:none!important}.nickrow select{font-size:16px;padding:6px;border-radius:8px;margin:2px}.codebig{font-family:var(--display);font-size:46px;letter-spacing:8px;color:var(--brass);text-align:center}'; document.head.appendChild(optStyle);
const hudEl=document.createElement('div'); hudEl.id='olhud'; document.body.appendChild(hudEl);
function hud(){ if(!O.on){ hudEl.style.display='none'; return; } hudEl.style.display='block';
  hudEl.textContent=O.kind==='co'?'👥 Together with '+fname():'🏁 Race to '+O.goal+' rooms · You '+O.cleared+' · '+fname()+' '+O.fc+(O.fl?' (room '+(O.fl)+')':''); }
function nickHtml(){ let a='<select id="nA" aria-label="Nickname, first word">',b='<select id="nB" aria-label="Nickname, second word">'; NICK_A.forEach((w,i)=>a+=`<option value="${i}"${i===myNick[0]?' selected':''}>${w}</option>`); NICK_B.forEach((w,i)=>b+=`<option value="${i}"${i===myNick[1]?' selected':''}>${w}</option>`); return '<div class="nickrow">'+a+'</select> '+b+'</select> <button class="chip" id="dice" aria-label="Random nickname">🎲</button></div>'; }
function readNick(el){ const a=el.querySelector('#nA'),b=el.querySelector('#nB'); if(a&&b){ myNick=[+a.value,+b.value]; try{ localStorage.setItem('escapeRoomOnlineName',JSON.stringify(myNick)); }catch(e){} } }
function entry(note){ netClose(); sheet('Escape Rooms Online',(note?`<p><b>${note}</b></p>`:'')+'<p>Escape together, or race a friend on another device. Pick a fun nickname:</p>'+nickHtml()+'<p><button class="btn go" id="mk">Make a room</button></p><p>Or join your friend’s room. Type their 4 letters:</p><p><input class="word" id="jc" maxlength="4" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="ABCD" aria-label="Room code"> <button class="btn go" id="jn">Join</button></p>',el=>{
  el.querySelector('#dice').onclick=()=>{ myNick=[(Math.random()*NICK_A.length)|0,(Math.random()*NICK_B.length)|0]; el.querySelector('#nA').value=myNick[0]; el.querySelector('#nB').value=myNick[1]; };
  el.querySelector('#mk').onclick=()=>{ readNick(el); open(randCode(),'p1'); };
  const join=()=>{ readNick(el); const c=el.querySelector('#jc').value.toUpperCase().replace(/[^A-Z]/g,''); if(c.length!==4) return toast('Type the 4 letters of the code.'); open(c,'p2'); };
  el.querySelector('#jn').onclick=join; el.querySelector('#jc').onkeydown=e=>{ if(e.key==='Enter') join(); }; }); }
function open(code,want){ netClose(); NET.code=code; NET.want=want; NET.state='connecting'; sheet('Connecting…','<p>Connecting to the game server…</p>');
  let ws; try{ ws=new WebSocket(serverBase().replace(/^http/,'ws')+'/api/room/'+code); }catch(e){ return entry('Could not connect. Check the internet and try again.'); }
  NET.ws=ws; ws.onmessage=e=>{ if(NET.ws!==ws) return; let m; try{ m=JSON.parse(e.data); }catch(_){ return; } onMsg(m); };
  ws.onclose=()=>{ if(NET.ws!==ws) return; NET.ws=null; lost(); }; ws.onerror=()=>{};
  NET.timer=setTimeout(()=>{ if(NET.state==='connecting'){ netClose(); entry('Could not reach the game server. Check the internet and try again.'); } },9000); }
function onMsg(m){ switch(m.t){
  case 'hello': clearTimeout(NET.timer); NET.role=m.role;
    if(NET.want==='p1'&&m.role!=='p1'){ open(randCode(),'p1'); return; }
    if(NET.want==='p2'&&m.role!=='p2'){ netClose(); entry('There is no room with the code '+NET.code+'. Check the code and try again.'); return; }
    NET.state='waiting'; if(m.role==='p1') sheet('Your room code','<div class="codebig">'+NET.code+'</div><p>Tell your friend this code. They tap <b>Join</b> and type it. Waiting for them…</p><button class="btn" id="cx">Cancel</button>',el=>el.querySelector('#cx').onclick=()=>entry());
    else sheet('Joining…','<p>Joined room '+NET.code+'! Saying hi…</p>'); break;
  case 'full': netClose(); entry('That room already has two players.'); break;
  case 'ready': NET.state='ready'; send({t:'name',a:myNick[0],b:myNick[1]}); if(NET.role==='p1') hostPick(); else guestWait(); break;
  case 'name': { const a=m.a|0,b=m.b|0; if(NICK_A[a]&&NICK_B[b]){ NET.friend=[a,b]; if(!O.on){ if(NET.role==='p1') hostPick(); else guestWait(); } else hud(); } } break;
  case 'cfg': if(NET.role==='p2') begin({k:m.k==='race'?'race':'co',d:['easy','medium','hard'].includes(m.d)?m.d:'easy',g:Math.max(1,Math.min(20,m.g|0)),sd:m.sd|0}); break;
  case 'p': if(m.l===S.lvl||true){ O.fp={x:+m.x||0,z:+m.z||0,y:+m.y||0,r:m.r|0,l:m.l|0}; } break;
  case 'st': if(O.on&&O.kind==='co') recvSt(m); break;
  case 'dr': if(O.on&&O.kind==='co'&&m.l===S.lvl){ const d=DOORS.find(x=>x.key===m.k); F[m.k]=m.v?1:0; O.sent[m.k]=F[m.k]; if(d&&d.open!==(m.v?1:0)){ d.open=m.v?1:0; tw(d.piv.rotation,'y',m.v?-1.9:0,550); } } break;
  case 'win': if(O.on&&O.kind==='co'&&m.l===S.lvl&&!done){ if(room!==0) enterNow(0); O.silent=true; win(); } break;
  case 'go': if(O.on&&O.kind==='co'&&(m.n|0)!==S.lvl&&(m.n|0)>=0&&(m.n|0)<LV.length) start(m.n|0); break;
  case 'at': if(O.on&&O.kind==='race'){ O.fl=(m.l|0)+1; O.fc=m.c|0; hud(); } break;
  case 'won': if(O.on&&O.kind==='race'&&!O.over){ O.over=true; done=true; closeSheet(); raceEnd(false); } break;
  case 'again': if(NET.role==='p1') hostPick(); else guestWait(); break;
  case 'left': lost(); break; } }
function lost(){ const was=NET.state==='ready'; const fn=fname(); netClose(); if(!was) return entry('The connection was closed. Try again.'); entry(fn+' left, or lost the internet. Start a new room to play again.'); }
function guestWait(){ sheet('Waiting…',`<p>${fname()} joined! 🎉</p><p>The host is choosing how to play. Hang on…</p>`); }
function hostPick(){ const C=O.cfg; sheet('Choose how to play',`<p>${fname()} joined! 🎉</p>
  <p><b>Game</b></p><div id="gk"><button class="btn opt${C.k==='co'?' cur':''}" data-v="co">👥 Together<br><small>Same room, shared items. Easier.</small></button><button class="btn opt${C.k==='race'?' cur':''}" data-v="race">🏁 Race<br><small>First to clear the rooms wins.</small></button></div>
  <p><b>Difficulty</b></p><div id="gd">${['easy','medium','hard'].map(m=>`<button class="btn opt${C.d===m?' cur':''}" data-v="${m}">${MODES[m].name}</button>`).join('')}</div>
  <div id="gg"${C.k==='race'?'':' style="display:none"'}><p><b>Race to how many rooms?</b></p>${[3,5,10,15,20].map(g=>`<button class="btn opt${C.g===g?' cur':''}" data-v="${g}">${g}</button>`).join('')}</div>
  <p><button class="btn go" id="gs">Start!</button></p>`,el=>{
  const pick=(id,fn)=>el.querySelector(id).onclick=e=>{ const b=e.target.closest('button'); if(!b) return; el.querySelectorAll(id+' .opt').forEach(x=>x.classList.remove('cur')); b.classList.add('cur'); fn(b.dataset.v); };
  pick('#gk',v=>{ C.k=v; el.querySelector('#gg').style.display=v==='race'?'':'none'; }); pick('#gd',v=>C.d=v); pick('#gg',v=>C.g=+v);
  el.querySelector('#gs').onclick=()=>{ const cfg={k:C.k,d:C.d,g:C.g,sd:1+Math.floor(Math.random()*1e9)}; send(Object.assign({t:'cfg'},cfg)); begin(cfg); }; }); }
function begin(c){ O.on=true; O.kind=c.k; O.goal=c.g; O.cleared=0; O.fc=0; O.fl=0; O.over=false; O.sent={}; S.mode=c.d; S.sd=c.sd||1; S.hints=0; S.ms=0; closeSheet(); start(0); hud();
  toast(c.k==='co'?'Together! Everything you open, you both open.':'Race! First to clear '+c.g+' rooms wins.'); }
function raceEnd(won){ done=true; sheet(won?'🏆 You won the race!':'🏁 '+fname()+' won the race!',`<p>${won?'You cleared '+O.goal+' rooms first. Amazing!':fname()+' cleared '+O.goal+' rooms first. You cleared '+O.cleared+'. Good try!'}</p><button class="btn go" id="pa">Play again</button>`,el=>el.querySelector('#pa').onclick=()=>{ O.on=false; hud(); send({t:'again'}); if(NET.role==='p1') hostPick(); else guestWait(); }); }
/* ---- together: shared state ---- */
const cOf=st=>({o:st.open?1:0,u:st.unlocked?1:0,s:st.smashed?1:0,g:st.got||0,d:st.drop||0,p:st.placed||[]});
function syncOut(){ for(const k in F){ const v=F[k]; if(k.indexOf(':')<0) continue;
    if(k.startsWith('d:')){ if(O.sent[k]!==v){ O.sent[k]=v; send({t:'dr',l:S.lvl,k,v}); } continue; }
    if(v&&typeof v==='object'&&!Array.isArray(v)){ const c=cOf(v), j=JSON.stringify(c); if(O.sent[k]!==j){ O.sent[k]=j; send({t:'st',l:S.lvl,k,c}); } } } }
function rebuildInv(){ const placed=new Set(), got=[]; for(const k in F){ const v=F[k]; if(k.indexOf(':')<0||k.startsWith('d:')||!v||typeof v!=='object'||Array.isArray(v)) continue; (v.placed||[]).forEach(x=>placed.add(x)); if(v.got) got.push(v.got); }
  const ni=got.filter(n=>!placed.has(n)); if(ni.join()!==inv.join()){ inv=ni; drawInv(); } }
function recvSt(m){ if(m.l!==S.lvl||typeof m.k!=='string'||m.k.length>12) return; const c=m.c||{}, k=m.k, st=F[k]||(F[k]={});
  const was={o:st.open,d:st.drop,g:st.got,pl:(st.placed||[]).length};
  if(c.o) st.open=1; if(c.u) st.unlocked=1; if(c.s) st.smashed=1; if(typeof c.g==='string'&&ICON[c.g]) st.got=c.g;
  if(Array.isArray(c.p)){ const set=new Set(st.placed||[]); c.p.forEach(x=>{ if(typeof x==='string'&&ICON[x]) set.add(x); }); st.placed=[...set]; }
  if(st.got) delete st.drop; else if(typeof c.d==='string'&&ICON[c.d]) st.drop=c.d;
  const p=PROPS.find(q=>q.id===k); if(p){
    if(st.open&&!was.o){ if(p.sockets) runAltar(p,true); else if(hamP(p)) smash(p,()=>{}); else { moveProp(p,650); if(p.o.secret){ AU.rumble(); shake=.09; dust(p); } else AU.tick(); } }
    if(p.sockets&&(st.placed||[]).length>was.pl) paintSockets(p);
    if(st.drop&&!was.d&&!p.dropW) spawnDrop(p,true);
    if(st.got&&!was.g&&p.dropW){ p.dropW.parent.remove(p.dropW); const i=SPIN.indexOf(p.dropW); if(i>=0) SPIN.splice(i,1); p.dropW=null; if(p.dropH){ const j=HIT.indexOf(p.dropH); if(j>=0) HIT.splice(j,1); p.dropH=null; } } }
  rebuildInv(); O.sent[k]=JSON.stringify(cOf(st)); if(st.got&&!was.g) toast(fname()+' picked up '+INAME[st.got]+'.'); }
/* ---- the friend's little explorer ---- */
function mkAvatar(){ const g=new T.Group(), col=NET.role==='p1'?'#3b82c4':'#d9534f';
  g.add(M(CY(.28,.34,.95,10),col,0,.5,0)); g.add(M(new T.SphereGeometry(.26,12,10),'#f2d3a8',0,1.25,0)); g.add(M(new T.ConeGeometry(.3,.3,10),col,0,1.6,0));
  const cv=document.createElement('canvas'); cv.width=256; cv.height=64; const x=cv.getContext('2d'); x.font='bold 28px sans-serif'; x.textAlign='center'; x.fillStyle='rgba(0,0,0,.6)'; x.fillRect(0,8,256,48); x.fillStyle='#fff'; x.fillText(fname(),128,44);
  const sp=new T.Sprite(new T.SpriteMaterial({map:new T.CanvasTexture(cv),depthTest:false})); sp.scale.set(1.2,.3,1); sp.position.y=2.05; g.add(sp); scene.add(g); return g; }
function tick(dt){ if(!O.on||NET.state!=='ready') return;
  O.acc+=dt; if(O.acc>.12){ O.acc=0; send({t:'p',x:+px.toFixed(2),z:+pz.toFixed(2),y:+yaw.toFixed(2),r:room,l:S.lvl}); }
  if(O.kind==='co'){ O.acc2+=dt; if(O.acc2>.25){ O.acc2=0; syncOut(); } }
  const f=O.fp; if(f&&f.l===S.lvl&&f.r===room){ if(!O.av) O.av=mkAvatar(); O.av.visible=true; const k=Math.min(1,dt*9); O.av.position.x+=(f.x-O.av.position.x)*k; O.av.position.z+=(f.z-O.av.position.z)*k; O.av.rotation.y=f.y; } else if(O.av) O.av.visible=false; }
/* ---- hooks the game calls ---- */
return {get on(){ return O.on; },
  menu(){ if(O.on||NET.state==='ready'){ sheet('Online',`<p>${O.on?(O.kind==='co'?'Together with ':'Racing '):'Connected to '}${fname()}.</p><button class="btn" id="lv">Leave the room</button>`,el=>el.querySelector('#lv').onclick=()=>entry()); } else if(NET.state==='waiting'||NET.state==='connecting') sheet('Waiting…','<p>Waiting for a friend to join…</p><button class="btn" id="cx">Cancel</button>',el=>el.querySelector('#cx').onclick=()=>entry()); else entry(); },
  onStart(n){ O.sent={}; O.fp=O.fp; if(O.kind==='race'&&O.on) send({t:'at',l:n,c:O.cleared}); hud(); },
  onWin(){ if(O.silent){ O.silent=false; return; } if(O.on&&O.kind==='co') send({t:'win',l:S.lvl}); },
  afterWin(){ if(O.kind==='co'){ sheet('Door open',`<p>${LV[S.lvl].n} cleared. Nice teamwork!</p><button class="btn go" id="next">Go to room ${S.lvl+2}</button>`,el=>el.querySelector('#next').onclick=()=>goLevel(S.lvl+1)); return; }
    O.cleared++; send({t:'at',l:S.lvl+1,c:O.cleared}); hud();
    if(O.cleared>=O.goal){ if(!O.over){ O.over=true; send({t:'won'}); raceEnd(true); } return; }
    sheet('Room cleared!',`<p>You have cleared ${O.cleared} of ${O.goal}. ${fname()} has cleared ${O.fc}.</p><button class="btn go" id="next">Next room</button>`,el=>el.querySelector('#next').onclick=()=>start(S.lvl+1)); },
  sendGo(n){ if(O.on&&O.kind==='co') send({t:'go',n}); },
  tick, open:entry };
})();

$('#brooms').textContent='Menu'; $('#brooms').onclick=()=>OL.menu(); setTimeout(()=>OL.open(),500);
</script>
