name = "felixwang-rooms"
main = "src/index.js"
compatibility_date = "2024-11-01"
workers_dev = false

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[durable_objects.bindings]]
name = "STATS"
class_name = "Stats"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Stats"]

# "Find a player" was tried and removed: v3 created its class, v4 deletes it.
[[migrations]]
tag = "v3"
new_sqlite_classes = ["Matchmaker"]

[[migrations]]
tag = "v4"
deleted_classes = ["Matchmaker"]
