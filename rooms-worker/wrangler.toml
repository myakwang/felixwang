name = "felixwang-rooms"
main = "src/index.js"
compatibility_date = "2024-11-01"
workers_dev = false

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[durable_objects.bindings]]
name = "STATS"
class_name = "Stats"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Stats"]

# "Find a player" was removed again; v3 created its class. It stays as an unused stub until
# the live site no longer binds it, then a later v4 migration can delete it.
[[migrations]]
tag = "v3"
new_sqlite_classes = ["Matchmaker"]
