<script>
(()=>{

/* ---------- levels ----------

 mobs: ['walk'|'fly'|'boss', minX, maxX, y]  (walk/boss: y = floor they stand on; fly: y = center height)
------------------------------------------------------------ */
const HAND=[
{name:"Level 1: The Fan Factory",width:2700,start:[60,420],
 solids:[[0,480,500,90],[560,420,50,20],[660,360,50,20],[760,300,260,24],[1080,480,240,90],[1280,160,240,24],[1640,480,280,90],[1820,210,200,24],[2100,480,600,90],[2300,220,60,260],[2400,410,50,20],[2500,330,30,150],[2460,310,110,20]],

 crumbles:[[1000,300,60,20],[2320,400,60,20]],
 springs:[[1420,456,60,24]],
 fans:[{x:1744,y:90,w:28,h:80,dir:'right',reach:250}],

{name:"Level 3: Moving Day",width:2600,start:[40,420],

 crumbles:[[1650,380,60,20],[1790,330,60,20],[1930,280,60,20]],

 goal:{kind:'flag',x:2480,y:410,w:70,h:70}},
{name:"Level 4: Windy Tower",width:2600,start:[40,420],
 solids:[[0,480,300,90],[300,480,160,90],[500,120,200,24],[600,300,270,24],[1040,300,200,24],[1400,480,300,90],[1560,170,160,24],[2000,480,600,90]],
 crumbles:[[1780,250,60,20],[1900,210,60,20]],
 springs:[[1450,456,60,24]],
 fans:[{x:340,y:460,w:80,h:20,dir:'up',top:75},{x:872,y:230,w:28,h:80,dir:'right',reach:270}],

/* ---------- bosses: one every 5 levels ---------- */
const BOSSES=[null,
 {name:'Beetle Queen',style:'beetle',w:64,h:50,hp:6,spd:1.6,hop:true},
 {name:'Spider Boss',style:'spider',w:72,h:44,hp:9,spd:1.9,hop:true,spit:150},
 {name:'Giant Wasp',style:'wasp',w:66,h:44,hp:10,spd:2.2,fly:true},
 {name:'Beetle Queen II',style:'beetle',w:70,h:54,hp:14,spd:2.2,hop:true,spit:110},
 {name:'Wasp Queen',style:'wasp',w:72,h:48,hp:16,spd:2.6,fly:true,spit:120},
 {name:'Bug King',style:'king',w:84,h:62,hp:22,spd:2.4,hop:true,spit:95,summon:280}];
const NAMES=['The Fan Factory','Star Sky','Moving Day','Windy Tower',"Beetle Queen's Nest",'Bug Alley','Bug Bounce','Bugs on the Move','Pencil Path',"Spider's Castle",
 'Eraser Hills','Crayon Canyon','Paperclip Pass','Ruler Ridge','The Wasp Hive','Scribble Swamp','Glue Gap','Sharpener Steps','Inkwell Island','The Queen Returns',
 'Doodle Drop','Marker Mountain','Sticky Note Sea','Stapler Storm',"Wasp Queen's Tower",'Highlighter Heights','Tape Trail','Crayon Clouds','The Last Page','The Bug King'];

/* ---------- level builder: joins tested pieces ("chunks") ---------- */
function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function genLevel(n){
  const R=rng(n*7919+13),ri=(a,b)=>a+Math.floor(R()*(b-a+1)),pick=a=>a[Math.floor(R()*a.length)];
  const diff=(n-1)/29,boss=n%5===0;
  const L={width:0,start:[40,420],solids:[[0,480,360,90]],crumbles:[],springs:[],movers:[],fans:[],mobs:[],stars:[],hearts:[],chunks:[]};
  const S=a=>L.solids.push(a),wspd=1.1+diff*1.1,fspd=1.5+diff*1.2;
  const ground=(gx,len)=>{S([gx,480,len,90]);
    if(len>=240&&R()<0.55+diff*0.45){const k=(len>=330&&R()<diff*1.3)?2:1,seg=len/k;for(let j=0;j<k;j++)L.mobs.push(['walk',gx+j*seg+20,gx+(j+1)*seg-20,480,wspd]);}
    if(R()<0.5)L.stars.push([gx+len/2,430]);
    return gx+len;};
  const CH={
    gap:(x,len)=>{const g=ri(100,150+Math.round(diff*20));L.stars.push([x+g/2,380]);return ground(x+g,len);},
    steps:(x,len)=>{S([x+50,410,150,20]);S([x+250,340,150,20]);S([x+450,270,150,20]);L.stars.push([x+325,290],[x+525,220]);return ground(x+680,len);},
    spring:(x,len)=>{S([x+80,480,160,90]);L.springs.push([x+130,456,60,24]);S([x+250,210,200,24]);L.stars.push([x+190,250],[x+350,165]);return ground(x+530,len);},
    wall:(x,len)=>{S([x+80,480,260,90]);L.springs.push([x+170,456,110,24]);S([x+280,220,60,260]);L.stars.push([x+310,165]);return ground(x+340,len);},
    fanUp:(x,len)=>{S([x+80,480,160,90]);L.fans.push({x:x+120,y:460,w:80,h:20,dir:'up',top:70});S([x+270,120,220,24]);L.stars.push([x+160,260],[x+380,80]);return ground(x+570,len);},
    rightFan:(x,len)=>{S([x+80,480,200,90]);S([x+400,400,300,24]);L.fans.push({x:x+702,y:330,w:28,h:80,dir:'right',reach:250});S([x+900,400,200,24]);L.stars.push([x+800,330],[x+1000,355]);return ground(x+1160,len);},
    moverH:(x,len)=>{L.movers.push([x+60,430,120,20,'x',x+60,x+360,1.3+diff*0.6]);L.stars.push([x+240,380]);return ground(x+480,len);},
    moverV:(x,len)=>{S([x+20,400,60,20]);L.movers.push([x+120,400,100,20,'y',160,400,1.2+diff*0.4]);S([x+280,160,220,24]);L.stars.push([x+170,250],[x+390,115]);return ground(x+570,len);},
    crumbles:(x,len)=>{[[60,400],[300,350],[540,300],[780,350]].forEach(c=>L.crumbles.push([x+c[0],c[1],110,20]));L.stars.push([x+355,300],[x+595,250]);return ground(x+980,len);},
    islands:(x,len)=>{S([x+120,480,120,90]);S([x+360,480,120,90]);L.stars.push([x+300,380]);return ground(x+600,len);}
  };
  const types=Object.keys(CH);
  let x=360,last='';
  const nChunks=boss?2+Math.floor(diff*2):5+Math.floor(diff*4);
  for(let c=0;c<nChunks;c++){
    let tp;do tp=pick(types);while(tp===last);last=tp;
    const x0=x;L.chunks.push({type:tp,x0});
    x=CH[tp](x,ri(240,380));
    if(n>5&&R()<0.15+diff*0.5)L.mobs.push(['fly',x0+40,x-40,ri(230,350),fspd]);
  }
  if(n>=6&&R()<0.6)L.hearts.push([x-90,420]);
  if(boss){const tier=n/5;
    L.hearts.push([x-60,420]);
    S([x+100,480,1150,90]);S([x+420,360,120,20]);S([x+820,360,120,20]);
    L.mobs.push(['boss',x+260,x+1080,480,tier]);
    L.stars.push([x+480,320],[x+880,320]);
    L.goal={kind:'cage',x:x+1140,y:380,w:84,h:100,needBoss:true};L.width=x+1250;
  }else{S([x+100,480,450,90]);L.goal={kind:'flag',x:x+430,y:410,w:70,h:70};L.width=x+560;}
  return L;
}
const LEVELS=[];
for(let n=1;n<=30;n++){
  let L;
  if(n<=4)L=HAND[n-1];
  else if(n>=6&&n<=8)L=HAND[n-2];
  else if(n===10){L=HAND[7];L.mobs=L.mobs.map(m=>m[0]==='boss'?['boss',m[1],m[2],m[3],2]:m);}
  else L=genLevel(n);
  L.name='Level '+n+': '+NAMES[n-1];L.weapon=n>=5;L.boss=n%5===0?BOSSES[n/5]:null;
  LEVELS.push(L);
}
const WEAPON_FROM=4;

/* ---------- state ---------- */
let LV=0,lv,blocks,stars,fans,goal,mobs,shots,blobs=[],pickups=[],p,safe,cam={x:0,y:0},t=0,state='title',flash=0,parts=[],hearts=3,fireCd=0,msg='',msgT=0;
let maxLevel=0;try{maxLevel=Math.min(LEVELS.length-1,parseInt(localStorage.getItem('paperAdventureMax')||'0',10)||0);}catch(e){}
function saveMax(i){if(i>maxLevel){maxLevel=i;try{localStorage.setItem('paperAdventureMax',String(i));}catch(e){}}}
function load(i){
  LV=i;lv=LEVELS[i];blocks=[];
  (lv.solids||[]).forEach(s=>blocks.push({x:s[0],y:s[1],w:s[2],h:s[3],kind:'solid'}));
  (lv.crumbles||[]).forEach(s=>blocks.push({x:s[0],y:s[1],w:s[2],h:s[3],kind:'crumble',timer:-1,gone:false,back:0}));
  (lv.springs||[]).forEach(s=>blocks.push({x:s[0],y:s[1],w:s[2],h:s[3],kind:'spring',squash:0}));
  (lv.movers||[]).forEach(s=>blocks.push({x:s[0],y:s[1],w:s[2],h:s[3],kind:'mover',axis:s[4],min:s[5],max:s[6],spd:s[7],ph:0,dx:0,dy:0}));
  fans=(lv.fans||[]).map(f=>Object.assign({},f));
  fans.forEach(f=>{if(f.dir==='up')blocks.push({x:f.x,y:f.y,w:f.w,h:f.h,kind:'fan'});});
  stars=lv.stars.map(s=>({x:s[0],y:s[1],got:false}));
  goal=lv.goal;
  mobs=(lv.mobs||[]).map((m,k)=>{
    if(m[0]==='walk')return{type:'walk',min:m[1],max:m[2],w:34,h:22,x:m[1]+Math.max(0,m[2]-m[1]-34)*((k*37)%10)/10,y:m[3]-22,vx:(m[4]||1.2)*(k%2?-1:1),hp:1,hit:0};
    if(m[0]==='fly')return{type:'fly',min:m[1],max:m[2],w:30,h:20,x:(m[1]+m[2])/2,by:m[3],y:m[3],vx:m[4]||1.6,hp:1,ph:k,hit:0};
    const B=BOSSES[m[4]||1];
    return{type:'boss',B,min:m[1],max:m[2],w:B.w,h:B.h,x:(m[1]+m[2])/2,y:m[3]-B.h,vx:B.spd,hp:B.hp,maxhp:B.hp,hit:0,hop:60,vy:0,floor:m[3]-B.h,ph:0,spitT:B.spit||0,sumT:B.summon||0};
  });
  shots=[];blobs=[];hearts=3;fireCd=0;
  pickups=(lv.hearts||[]).map(h=>({x:h[0],y:h[1],got:false}));
  p={x:lv.start[0],y:lv.start[1],w:24,h:48,vx:0,vy:0,grounded:false,coyote:0,face:1,walk:0,ground:null,inv:0,kb:0,sprung:false};
  safe={x:p.x,y:p.y};parts=[];msg='';msgT=0;
  document.getElementById('bf').classList.toggle('hide',!lv.weapon);
}
function bossBanner(){if(lv.boss){msg='Boss level! Beat the '+lv.boss.name+'!';msgT=170;}}
function startLevel(i){
  initAudio();load(i);setSong(lv.boss?'boss':'main');
  if(i===WEAPON_FROM){state='intro';
    showOv("You found the Pencil Blaster! ✏️","<p>Bugs live from here on, and they hurt!<br>Each bug hit costs a ❤️.<br>Press <b>FIRE</b> (or <b>X</b>) to shoot pencils,<br>or jump on a bug's head to squash it.<br>👑 A boss waits at the end of every 5th level!</p>","Let's go!",()=>{state='play';bossBanner();});}
  else{state='play';bossBanner();}
}

/* ---------- input ---------- */
const keys={l:false,r:false,j:false,f:false};let jumpBuf=0;
function setKey(k,v){if(k==='j'&&v&&!keys.j)jumpBuf=8;keys[k]=v;}
const KM={ArrowLeft:'l',KeyA:'l',ArrowRight:'r',KeyD:'r',ArrowUp:'j',KeyW:'j',Space:'j',KeyX:'f',KeyF:'f',KeyK:'f'};
addEventListener('keydown',e=>{
  if(state!=='play'&&(e.code==='Enter'||e.code==='Space')){e.preventDefault();ovb.click();return;}
  const k=KM[e.code];if(k){setKey(k,true);e.preventDefault();}
});
addEventListener('keyup',e=>{const k=KM[e.code];if(k)setKey(k,false);});
[['bl','l'],['br','r'],['bj','j'],['bf','f']].forEach(([id,k])=>{
  const el=document.getElementById(id);
  const on=e=>{e.preventDefault();initAudio();setKey(k,true);el.classList.add('on');};
  const off=e=>{e.preventDefault();setKey(k,false);el.classList.remove('on');};

let AC=null;
function initAudio(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(AC&&AC.state==='suspended'&&!document.hidden)AC.resume().catch(()=>{});musicStart();}
function tone(f,d,type,slide,vol){if(!AC)return;try{const o=AC.createOscillator(),g=AC.createGain();o.type=type||'square';o.frequency.setValueAtTime(f,AC.currentTime);if(slide)o.frequency.exponentialRampToValueAtTime(slide,AC.currentTime+d);g.gain.setValueAtTime(vol||.08,AC.currentTime);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d);}catch(e){}}
/* ---------- music: original tunes for Paper Adventure, played by WebAudio ----------
 one token per 8th note: note name, '-' = hold the note longer, '.' = rest
------------------------------------------------------------------------------------ */
const SONGS={
 main:{bpm:132,vol:1,
  mel:'E5 - G5 - C6 - G5 E5 | D5 - G5 - B5 - A5 G5 | C5 E5 A5 - G5 - E5 - | F5 - A5 - C6 - A5 - | G5 - E5 G5 C6 - B5 C6 | D6 - B5 - G5 - A5 B5 | C6 - A5 F5 A5 - G5 F5 | G5 - D5 - G5 - . . |'+
      'C5 - E5 - G5 - E5 C5 | B4 - D5 - G5 - D5 B4 | A4 - C5 E5 A5 - G5 - | F5 E5 D5 C5 A4 - C5 - | E5 - - G5 - - C6 - | B5 - G5 - D5 - G5 - | A5 - F5 - C6 - A5 - | G5 - - - . . . .',
  chords:'C G Am F C G F G C G Am F C G F G'},
 boss:{bpm:152,vol:1.1,
  mel:'A4 - C5 - E5 - D5 C5 | B4 - C5 - A4 - - . | F5 - E5 - C5 - A4 - | G4 - B4 - D5 - E5 - | A5 - G5 - E5 - C5 D5 | E5 - - . E5 F5 E5 D5 | G#5 - E5 - B4 - E5 - | G#5 - B5 - E5 - . .',
  chords:'Am Am F G Am Am E E'}
};
const NOTE_I={C:0,'C#':1,D:2,'D#':3,E:4,F:5,'F#':6,G:7,'G#':8,A:9,'A#':10,B:11};
function nfreq(n){const m=n.match(/^([A-G]#?)(\d)$/);return 440*Math.pow(2,(NOTE_I[m[1]]+12*(+m[2]+1)-69)/12);}
const CHORD={C:['C3','G3','C4'],G:['G2','D3','G3'],Am:['A2','E3','A3'],F:['F2','C3','F3'],E:['E2','B2','E3']};
Object.values(SONGS).forEach(S=>{S.tok=S.mel.replace(/\|/g,' ').trim().split(/\s+/);S.len=S.tok.length;S.ch=S.chords.split(' ');});
const mus={on:true,song:null,step:0,next:0,timer:null,gain:null,noise:null};
try{mus.on=localStorage.getItem('paperAdventureMusic')!=='0';}catch(e){}
function musicStart(){
  if(!AC||mus.timer)return;
  mus.gain=AC.createGain();mus.gain.gain.value=mus.on?0.55:0;mus.gain.connect(AC.destination);
  const len=AC.sampleRate*0.3,buf=AC.createBuffer(1,len,AC.sampleRate),d=buf.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1;mus.noise=buf;
  mus.next=AC.currentTime+0.1;mus.timer=setInterval(musicTick,25);
  if(!mus.song)setSong(state==='play'&&lv&&lv.boss&&mobs.some(m=>m.type==='boss'&&m.hp>0)?'boss':'main');
}
function setSong(name){const S=name?SONGS[name]:null;if(S===mus.song)return;mus.song=S;mus.step=0;if(AC)mus.next=AC.currentTime+0.08;}
function voice(type,f,t0,dur,vol,f2){const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t0);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t0+dur);
  g.gain.setValueAtTime(0.0001,t0);g.gain.linearRampToValueAtTime(vol,t0+0.01);g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);o.connect(g);g.connect(mus.gain);o.start(t0);o.stop(t0+dur+0.02);}
function hiss(t0,dur,vol,hp){const s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();s.buffer=mus.noise;f.type='highpass';f.frequency.value=hp;
  g.gain.setValueAtTime(vol,t0);g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);s.connect(f);f.connect(g);g.connect(mus.gain);s.start(t0);s.stop(t0+dur+0.02);}
function musicTick(){
  if(!AC||AC.state!=='running')return;
  if(!mus.song){mus.next=AC.currentTime+0.05;return;}
  const S=mus.song,e=60/S.bpm/2;
  if(mus.next<AC.currentTime-0.2)mus.next=AC.currentTime+0.05;
  while(mus.next<AC.currentTime+0.15){
    const i=mus.step%S.len,t0=mus.next,v=S.vol,tk=S.tok[i];
    if(tk!=='-'&&tk!=='.'){let n=1;while(S.tok[(i+n)%S.len]==='-')n++;voice('square',nfreq(tk),t0,n*e*0.92,0.045*v);voice('square',nfreq(tk)*1.005,t0,n*e*0.6,0.012*v);}
    const bar=Math.floor(i/8),b8=i%8,ch=CHORD[S.ch[bar%S.ch.length]];
    const bn=S===SONGS.boss?ch[b8%4===3?1:0]:ch[[0,0,2,0,0,1,2,1][b8]];
    voice('triangle',nfreq(bn),t0,e*0.85,0.11*v);
    if(b8===0||b8===4||(S===SONGS.boss&&b8===6))voice('sine',150,t0,0.12,0.16*v,45);
    if(b8===2||b8===6)hiss(t0,0.09,0.06*v,1800);
    hiss(t0,0.025,0.025*v,7000);
    mus.next+=e;mus.step++;
  }
}

  if(mus.gain)mus.gain.gain.setTargetAtTime(on?0.55:0,AC.currentTime,0.05);document.getElementById('music').textContent=on?'🎵':'🔇';}

/* ---------- physics ---------- */
const G=0.6,SPEED=5,JUMP=12.5,SPRING=19;
function overlap(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;}
function activeBlocks(){return blocks.filter(b=>!(b.kind==='crumble'&&b.gone));}
function puff(x,y,n,col){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=1+Math.random()*3;parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,life:30+Math.random()*15,col});}}
function hurtPlayer(fromX){
  if(p.inv>0)return;
  hearts--;sfx.hurt();p.inv=80;p.kb=12;p.vx=(p.x+p.w/2<fromX?-7:7);p.vy=-6;p.grounded=false;
  if(hearts<=0)loseLevel();
}
function step(dt){
  // movers
  blocks.forEach(b=>{if(b.kind!=='mover')return;
    b.ph+=dt*0.012*b.spd;const pos=b.min+(b.max-b.min)*(0.5-0.5*Math.cos(b.ph));
    if(b.axis==='x'){b.dx=pos-b.x;b.dy=0;b.x=pos;}else{b.dy=pos-b.y;b.dx=0;b.y=pos;}});
  if(p.ground&&p.ground.kind==='mover'){p.x+=p.ground.dx;p.y+=p.ground.dy;}
  // crumbles & springs
  blocks.forEach(b=>{
    if(b.kind==='spring'&&b.squash>0)b.squash-=dt;
    if(b.kind!=='crumble')return;
    if(b.gone){b.back-=dt;if(b.back<=0&&!overlap(p,b)){b.gone=false;b.timer=-1;}}
    else if(b.timer>=0){b.timer-=dt;if(b.timer<=0){b.gone=true;b.back=200;sfx.crumble();for(let i=0;i<8;i++)parts.push({x:b.x+Math.random()*b.w,y:b.y+10,vx:(Math.random()-.5)*3,vy:-Math.random()*3,life:40,col:'#555'});}}});
  // control
  const dir=(keys.r?1:0)-(keys.l?1:0);
  if(p.kb>0)p.kb-=dt;
  else{if(dir)p.face=dir;p.vx+=(dir*SPEED-p.vx)*Math.min(1,(p.grounded?0.4:0.2)*dt);}
  if(p.inv>0)p.inv-=dt;
  // wind
  const cx=p.x+p.w/2,cy=p.y+p.h/2;
  fans.forEach(f=>{
    if(f.dir==='up'){if(cx>f.x-6&&cx<f.x+f.w+6&&p.y+p.h>f.top&&p.y+p.h<=f.y+2){p.vy-=1.25*dt;if(p.vy<-7)p.vy=-7;}}
    else if(cx>f.x&&cx<f.x+f.w+f.reach&&cy>f.y-70&&cy<f.y+f.h+70){p.vx+=0.55*dt;if(p.vx>9)p.vx=9;}
  });
  // jump
  if(jumpBuf>0)jumpBuf-=dt;
  if(p.grounded)p.coyote=7;else p.coyote-=dt;
  if(jumpBuf>0&&p.coyote>0){p.vy=-JUMP;p.coyote=0;jumpBuf=0;p.grounded=false;sfx.jump();}
  if(!keys.j&&p.vy<-6&&!p.sprung)p.vy=-6;
  p.vy+=G*dt;if(p.vy>14)p.vy=14;
  if(p.vy>=0)p.sprung=false;
  const bl=activeBlocks();
  // x
  p.x+=p.vx*dt;
  if(p.x<0){p.x=0;p.vx=0;}
  if(p.x+p.w>lv.width){p.x=lv.width-p.w;p.vx=0;}
  bl.forEach(b=>{if(overlap(p,b)){
    if(b.kind==='mover'&&p.y+p.h-b.y<14){p.y=b.y-p.h;return;}
    if(p.x+p.w/2<b.x+b.w/2)p.x=b.x-p.w;else p.x=b.x+b.w;p.vx=0;}});
  // y
  p.y+=p.vy*dt;p.grounded=false;p.ground=null;
  bl.forEach(b=>{if(overlap(p,b)){
    if(p.vy>=0&&p.y+p.h/2<b.y+b.h/2){p.y=b.y-p.h;
      if(b.kind==='spring'){p.vy=-SPRING;p.sprung=true;b.squash=10;sfx.spring();}
      else{p.vy=0;p.grounded=true;p.ground=b;}}
    else if(p.vy<0){p.y=b.y+b.h;p.vy=0;}}});
  if(p.ground){const g=p.ground;
    if(g.kind==='crumble'&&g.timer<0)g.timer=30;
    if(g.kind==='solid'){safe.x=Math.max(g.x+6,Math.min(p.x,g.x+g.w-p.w-6));safe.y=g.y-p.h;}}
  if(p.grounded&&Math.abs(p.vx)>0.5)p.walk+=Math.abs(p.vx)*0.06*dt;
  // weapon
  if(fireCd>0)fireCd-=dt;
  if(lv.weapon&&keys.f&&fireCd<=0){fireCd=16;sfx.shoot();shots.push({x:p.x+p.w/2+p.face*14,y:p.y+27,vx:p.face*11,life:55});}
  shots.forEach(s=>{s.x+=s.vx*dt;s.life-=dt;
    if(bl.some(b=>b.kind!=='spring'&&s.x>b.x&&s.x<b.x+b.w&&s.y>b.y&&s.y<b.y+b.h)){s.life=0;puff(s.x,s.y,4,'#999');}
    mobs.forEach(m=>{if(m.hp>0&&s.life>0&&s.x>m.x-6&&s.x<m.x+m.w+6&&s.y>m.y-10&&s.y<m.y+m.h+10){s.life=0;hitMob(m);}});});
  shots=shots.filter(s=>s.life>0);
  // mobs
  mobs.forEach(m=>{if(m.hp<=0)return;
    if(m.hit>0)m.hit-=dt;
    m.x+=m.vx*dt;
    if(m.x<m.min){m.x=m.min;m.vx=Math.abs(m.vx);}
    if(m.x+m.w>m.max){m.x=m.max-m.w;m.vx=-Math.abs(m.vx);}
    if(m.type==='fly'){m.ph+=0.05*dt;m.y=m.by+Math.sin(m.ph)*34-m.h/2;}
    if(m.type==='boss')bossAI(m,dt);
    if(overlap(p,m)&&state==='play'){
      const stomp=p.vy>0.5&&(p.y+p.h)-m.y<18;
      if(stomp){p.vy=keys.j?-12:-9;p.sprung=true;hitMob(m);}
      else hurtPlayer(m.x+m.w/2);
    }});
  // boss spit blobs
  blobs.forEach(b=>{b.x+=b.vx*dt;b.y+=b.vy*dt;b.vy+=0.22*dt;b.life-=dt;
    if(bl.some(k=>b.x>k.x&&b.x<k.x+k.w&&b.y>k.y&&b.y<k.y+k.h)){b.life=0;puff(b.x,b.y,5,'#8c4');}
    if(b.life>0&&b.x>p.x-6&&b.x<p.x+p.w+6&&b.y>p.y-6&&b.y<p.y+p.h+6&&state==='play'){b.life=0;hurtPlayer(b.x);}
    shots.forEach(s=>{if(s.life>0&&Math.abs(s.x-b.x)<14&&Math.abs(s.y-b.y)<14){s.life=0;b.life=0;puff(b.x,b.y,5,'#8c4');}});});
  blobs=blobs.filter(b=>b.life>0);
  // heart pickups
  pickups.forEach(h=>{if(!h.got&&Math.abs(h.x-(p.x+p.w/2))<26&&Math.abs(h.y-(p.y+p.h/2))<34){if(hearts<3){h.got=true;hearts=Math.min(3,hearts+1);tone(660,.1,'triangle');setTimeout(()=>tone(990,.15,'triangle'),90);}}});
  // stars
  stars.forEach(s=>{if(!s.got){const dx=s.x-(p.x+p.w/2),dy=s.y-(p.y+p.h/2);if(dx*dx+dy*dy<30*30){s.got=true;sfx.star();for(let i=0;i<10;i++){const a=Math.random()*6.28;parts.push({x:s.x,y:s.y,vx:Math.cos(a)*3,vy:Math.sin(a)*3,life:30,star:true});}}}});
  // fall
  if(p.y>720){p.x=safe.x;p.y=safe.y;p.vx=0;p.vy=0;flash=20;p.inv=Math.max(p.inv,40);hearts--;if(hearts<=0){loseLevel();return;}sfx.fall();}
  // goal
  if(state==='play'&&overlap(p,goal)){
    if(goal.needBoss&&mobs.some(m=>m.type==='boss'&&m.hp>0)){if(msgT<=0){msg='Defeat the '+(lv.boss?lv.boss.name:'boss')+' first!';msgT=90;}}
    else winLevel();
  }
  if(msgT>0)msgT-=dt;
  parts.forEach(q=>{q.x+=q.vx*dt;q.y+=q.vy*dt;q.vy+=0.2*dt;q.life-=dt;});parts=parts.filter(q=>q.life>0);
  if(flash>0)flash-=dt;
}
function bossAI(m,dt){
  const B=m.B,pcx=p.x+p.w/2,mcx=m.x+m.w/2,near=Math.abs(pcx-mcx)<750;
  if(pcx>m.min&&pcx<m.max&&Math.random()<0.02*dt)m.vx=(pcx>mcx?1:-1)*Math.abs(m.vx);
  if(B.fly){m.ph+=0.022*dt;m.y=m.floor-(0.5+0.5*Math.cos(m.ph))*210;}
  if(B.hop){m.hop-=dt;if(m.hop<=0&&m.y>=m.floor){m.vy=-9-(B.hp>12?2:0);m.hop=90+Math.random()*80;}
    m.vy+=0.5*dt;m.y+=m.vy*dt;if(m.y>m.floor){m.y=m.floor;m.vy=0;}}
  if(B.spit&&near){m.spitT-=dt;if(m.spitT<=0){m.spitT=B.spit*(0.7+Math.random()*0.6);const dx=pcx-mcx;
    blobs.push({x:mcx+Math.sign(dx)*m.w*0.4,y:m.y+m.h*0.4,vx:Math.sign(dx)*Math.min(6.5,Math.max(2.5,Math.abs(dx)/45)),vy:-5.5,life:200});tone(150,.15,'square',300,.05);}}
  if(B.summon&&near){m.sumT-=dt;if(m.sumT<=0){m.sumT=B.summon;if(mobs.filter(o=>o.summoned&&o.hp>0).length<3)
    mobs.push({type:'fly',summoned:true,min:m.min,max:m.max,w:30,h:20,x:mcx,by:300,y:300,vx:2*(Math.random()<.5?1:-1),hp:1,ph:Math.random()*6,hit:0});}}
}
function hitMob(m){
  m.hp--;m.hit=12;
  if(m.type==='boss'){sfx.boss();puff(m.x+m.w/2,m.y+m.h/2,8,'#7a3');if(m.hp<=0){puff(m.x+m.w/2,m.y+m.h/2,40,'#7a3');blobs=[];mobs.forEach(o=>{if(o.summoned)o.hp=0;});msg='The '+m.B.name+' is beaten! Free your friend!';msgT=170;setSong('main');}}
  else{sfx.squash();puff(m.x+m.w/2,m.y+m.h/2,14,'#7a3');}
}

/* ---------- pencil drawing helpers ---------- */
function rnd(s){const x=Math.sin(s*127.1+311.7)*43758.5453;return (x-Math.floor(x))*2-1;}
function sline(x1,y1,x2,y2,s){
  for(let k=0;k<2;k++){const n=rnd(s+k*9)*1.4;ctx.beginPath();ctx.moveTo(x1+n,y1+rnd(s+k*3)*1.2);
    ctx.quadraticCurveTo((x1+x2)/2+rnd(s+k*5+1)*2,(y1+y2)/2+rnd(s+k*7+2)*2,x2+rnd(s+k*11)*1.4,y2+rnd(s+k*13)*1.2);ctx.stroke();}
}

function stick(x,y,face,walk,airborne,wave,armed){
  const cx=x+12;ctx.lineWidth=2.4;ctx.strokeStyle='#2b2b2b';

  ctx.beginPath();
  if(wave){ctx.moveTo(cx,y+22);ctx.lineTo(cx-10,y+30);ctx.moveTo(cx,y+22);ctx.lineTo(cx+9,y+12+Math.sin(t*0.2)*4);}

    ctx.save();ctx.translate(cx+face*13,y+22);ctx.scale(face,1);

function drawBoss(m){

    for(let k=0;k<4;k++){const ox=(k-1.5)*12;ctx.moveTo(cx+ox,y+h*0.5);ctx.lineTo(cx+ox-22-k*3,y+h*0.15+(k%2?lg:-lg));ctx.lineTo(cx+ox-30-k*4,y+h);
      ctx.moveTo(cx+ox,y+h*0.5);ctx.lineTo(cx+ox+22+k*3,y+h*0.15+(k%2?-lg:lg));ctx.lineTo(cx+ox+30+k*4,y+h);}ctx.stroke();
    ctx.fillStyle='#5b4a6e';ctx.beginPath();ctx.ellipse(cx-dir*8,y+h*0.45,w*0.38,h*0.42,0,0,7);ctx.fill();ctx.stroke();

  }else if(B.style==='wasp'){

    ctx.beginPath();ctx.ellipse(cx-10,y-4-fl*.4,20,10+fl*.4,-0.4,0,7);ctx.fill();ctx.stroke();
    ctx.beginPath();ctx.ellipse(cx+12,y-4-fl*.4,20,10+fl*.4,0.4,0,7);ctx.fill();ctx.stroke();
    ctx.fillStyle='#ffd23f';ctx.beginPath();ctx.ellipse(cx,y+h*0.55,w*0.45,h*0.38,0,0,7);ctx.fill();ctx.stroke();
    ctx.save();ctx.beginPath();ctx.ellipse(cx,y+h*0.55,w*0.45,h*0.38,0,0,7);ctx.clip();ctx.fillStyle='#2b2b2b';for(let k=-2;k<=1;k++)ctx.fillRect(cx+k*14+3,y,7,h);ctx.restore();

    if(B.spit){ctx.fillStyle='#ffd646';ctx.beginPath();const c2=cx,c3=y-14;ctx.moveTo(c2-12,c3+8);ctx.lineTo(c2-12,c3-4);ctx.lineTo(c2-6,c3+2);ctx.lineTo(c2,c3-7);ctx.lineTo(c2+6,c3+2);ctx.lineTo(c2+12,c3-4);ctx.lineTo(c2+12,c3+8);ctx.closePath();ctx.fill();ctx.stroke();}

    ctx.fillStyle='#ffd646';[[-0.5,0.38],[0.3,0.3],[-0.15,0.2],[0.6,0.45],[0,0.42]].forEach(d=>{ctx.beginPath();ctx.arc(cx+d[0]*r,y+h*d[1]+4,5,0,7);ctx.fill();ctx.stroke();});

    ctx.fillStyle='#ffd646';ctx.beginPath();const c2=cx-6,c3=y-8;ctx.moveTo(c2-22,c3+12);ctx.lineTo(c2-22,c3-10);ctx.lineTo(c2-11,c3);ctx.lineTo(c2,c3-16);ctx.lineTo(c2+11,c3);ctx.lineTo(c2+22,c3-10);ctx.lineTo(c2+22,c3+12);ctx.closePath();ctx.fill();ctx.stroke();

function drawBug(m){
  const cx=m.x+m.w/2,dir=m.vx>=0?1:-1;
  ctx.save();if(m.hit>0&&Math.floor(m.hit/3)%2)ctx.globalAlpha=.4;
  ctx.strokeStyle='#2b2b2b';ctx.lineWidth=2;
  if(m.type==='fly'){
    const fl=Math.sin(t*0.6)*6;
    ctx.fillStyle='rgba(200,230,255,.7)';

    ctx.beginPath();ctx.ellipse(cx+6,m.y-2-fl*.3,9,5+fl*.3,0.5,0,Math.PI*2);ctx.fill();ctx.stroke();

    ctx.fillStyle=big?(m.B&&m.B.spit?'#6fa8dc':'#c97ad6'):'#ff8a65';ctx.beginPath();ctx.ellipse(cx,m.y+m.h*0.55,r,m.h*0.42,0,Math.PI,0);ctx.closePath();ctx.fill();ctx.stroke();
    ctx.beginPath();ctx.moveTo(cx,m.y+m.h*0.13);ctx.lineTo(cx,m.y+m.h*0.55);ctx.stroke();
    ctx.fillStyle='#2b2b2b';[[-0.45,0.36],[0.3,0.3],[-0.2,0.22],[0.55,0.45]].forEach(d=>{ctx.beginPath();ctx.arc(cx+d[0]*r,m.y+m.h*d[1]+4,big?4:2.5,0,7);ctx.fill();});
    const hx=cx+dir*r*0.95,hy=m.y+m.h*0.45;

function eyes(x,y,dir,r){ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(x,y,r+1.2,0,7);ctx.fill();ctx.stroke();ctx.fillStyle='#2b2b2b';ctx.beginPath();ctx.arc(x+dir*1,y,r*0.6,0,7);ctx.fill();

/* ---------- render ---------- */
function render(){
  ctx.setTransform(DPR*scale,0,0,DPR*scale,0,0);
  cam.x=Math.max(0,Math.min(p.x+p.w/2-viewW*0.4,Math.max(0,lv.width-viewW)));
  cam.y=Math.min(0,560-viewH);

  ctx.strokeStyle='#d6e4f2';ctx.lineWidth=1.2;

  ctx.strokeStyle='#f0b8b8';ctx.beginPath();const mx=70-cam.x*0.3;ctx.moveTo(mx,0);ctx.lineTo(mx,viewH);ctx.stroke();

  fans.forEach(f=>{
    ctx.strokeStyle='rgba(80,80,80,.45)';ctx.lineWidth=1.6;
    if(f.dir==='up'){
      const h=f.y-f.top;
      for(let k=0;k<5;k++){const lx=f.x+8+k*(f.w-16)/4;for(let j=0;j<4;j++){const yy=f.y-((t*5+j*h/4+k*23)%h);sline(lx,yy,lx+rnd(k+j)*3,yy-26,k*7+j);}}
      ctx.strokeStyle='#2b2b2b';ctx.lineWidth=2.2;ctx.fillStyle='#fff';ctx.beginPath();ctx.ellipse(f.x+f.w/2,f.y+f.h/2,f.w/2+6,f.h/2+8,0,0,Math.PI*2);ctx.fill();ctx.stroke();
      ctx.save();ctx.translate(f.x+f.w/2,f.y+f.h/2);ctx.scale(1,0.45);flower(0,0,22,t*0.3);ctx.restore();
    }else{
      for(let k=0;k<5;k++){const ly=f.y-40+k*(f.h+80)/4;for(let j=0;j<4;j++){const xx=f.x+f.w+((t*6+j*f.reach/4+k*31)%f.reach);sline(xx,ly,xx+30,ly+rnd(k+j)*3,k*5+j);}}
      ctx.strokeStyle='#2b2b2b';ctx.lineWidth=2.2;ctx.fillStyle='#fff';ctx.beginPath();ctx.ellipse(f.x+f.w/2,f.y+f.h/2,f.w/2+4,f.h/2+8,0,0,Math.PI*2);ctx.fill();ctx.stroke();
      ctx.save();ctx.translate(f.x+f.w/2,f.y+f.h/2);ctx.scale(0.5,1);flower(0,0,28,t*0.3);ctx.restore();
    }
  });
  // blocks
  blocks.forEach((b,i)=>{
    ctx.strokeStyle='#2b2b2b';ctx.lineWidth=2.2;
    if(b.kind==='solid')srect(b.x,b.y,b.w,b.h,i*17+3,'#fff');
    else if(b.kind==='mover'){srect(b.x,b.y,b.w,b.h,i*19,'#e8f4ff');ctx.lineWidth=1.6;const mx2=b.x+b.w/2,my=b.y+b.h/2;ctx.beginPath();
      if(b.axis==='x'){ctx.moveTo(mx2-18,my);ctx.lineTo(mx2+18,my);ctx.moveTo(mx2-13,my-4);ctx.lineTo(mx2-18,my);ctx.lineTo(mx2-13,my+4);ctx.moveTo(mx2+13,my-4);ctx.lineTo(mx2+18,my);ctx.lineTo(mx2+13,my+4);}
      else{ctx.moveTo(mx2-14,my);ctx.lineTo(mx2+14,my);ctx.moveTo(mx2-4,my-6);ctx.lineTo(mx2,my-9);ctx.lineTo(mx2+4,my-6);ctx.moveTo(mx2-4,my+6);ctx.lineTo(mx2,my+9);ctx.lineTo(mx2+4,my+6);}

  });

  ctx.strokeStyle='#2b2b2b';ctx.lineWidth=2.2;
  if(goal.kind==='flag'){const fx=goal.x+35,top=goal.y,bot=goal.y+goal.h;sline(fx,bot,fx,top,5);ctx.fillStyle='#ffd646';ctx.beginPath();ctx.moveTo(fx,top+2);ctx.lineTo(fx+30+Math.sin(t*.15)*3,top+12);ctx.lineTo(fx,top+24);ctx.closePath();ctx.fill();ctx.stroke();}
  else{const g=goal;srect(g.x,g.y,g.w,g.h,77,'rgba(255,255,255,.6)');stick(g.x+30,g.y+48,-1,0,false,true);
    ctx.lineWidth=2;ctx.strokeStyle='#2b2b2b';for(let k=1;k<5;k++)sline(g.x+k*g.w/5,g.y,g.x+k*g.w/5,g.y+g.h,80+k);
    ctx.font='16px "Comic Sans MS",cursive';ctx.fillStyle='#333';ctx.fillText('Help!',g.x+16,g.y-10-Math.abs(Math.sin(t*.08))*6);}

  ctx.fillStyle='#333';ctx.font='bold 20px "Comic Sans MS","Chalkboard SE",cursive';ctx.fillText(lv.name,14,30);
  ctx.strokeStyle='#2b2b2b';ctx.lineWidth=1.8;starShape(26,56,11,'#ffe36e');
  ctx.fillStyle='#333';ctx.fillText(countStars()+' / '+stars.length,44,63);
  for(let i=0;i<3;i++)heart(130+i*28,55,10,i<hearts);
  if(msgT>0){ctx.font='bold 22px "Comic Sans MS","Chalkboard SE",cursive';const w=ctx.measureText(msg).width;ctx.fillStyle='rgba(255,255,255,.85)';ctx.fillRect(viewW/2-w/2-12,82,w+24,36);ctx.strokeRect(viewW/2-w/2-12,82,w+24,36);ctx.fillStyle='#333';ctx.fillText(msg,viewW/2-w/2,108);}
}

/* ---------- loop ---------- */
let last=performance.now();
function loop(now){
  let dt=Math.min(2.5,(now-last)/16.667);last=now;
  if(state==='play'){const n=dt>1?Math.ceil(dt):1;for(let i=0;i<n&&state==='play';i++)step(dt/n);}
  t+=dt;render();requestAnimationFrame(loop);
}
if(new URLSearchParams(location.search).has('test'))window.__game={get mus(){return mus},get levels(){return LEVELS},get blocks(){return blocks},get blobs(){return blobs},get p(){return p},get mobs(){return mobs},get state(){return state},startLevel,get lv(){return LV}};
load(0);menu();requestAnimationFrame(loop);
})();
