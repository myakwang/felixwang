<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#10181c">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Escape Rooms">
<title>Felix's Escape Rooms</title>
<style>
@font-face{font-family:"Patrick Hand";src:url("patrick-hand.woff2") format("woff2");font-display:swap}
:root{
  /* layout: one phone-width column. status bar, 3D room, pockets, caption. clues and locks open in a bottom sheet. */
  --ink:#10181c;
  --panel:#1b272d;
  --line:#32444c;
  --text:#e8e2d2;
  --dim:#9aa9ab;
  --brass:#e0a73a;
  --paper:#f1e6c8;
  --paperink:#2b241a;
  --good:#58c98a;
  --bad:#e5604d;
  --display:"Patrick Hand","Chalkboard SE","Comic Sans MS",cursive;
  --note:"Patrick Hand","Chalkboard SE","Comic Sans MS",cursive;
  --body:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--ink);color:var(--text);font-family:var(--body);font-size:16px;line-height:1.45;display:flex;justify-content:center}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible{outline:3px solid var(--brass);outline-offset:2px}
#app{position:fixed;inset:0}
.bar{position:fixed;left:0;right:0;top:0;z-index:3;display:flex;align-items:center;gap:8px;pointer-events:none;
  padding:max(8px,env(safe-area-inset-top)) max(10px,env(safe-area-inset-right)) 18px max(10px,env(safe-area-inset-left));
  background:linear-gradient(rgba(10,15,17,.78),rgba(10,15,17,0))}
.bar>*{pointer-events:auto}
.bar h1{text-shadow:0 1px 4px #000}
.bar h1{font-family:var(--display);font-weight:400;font-size:25px;letter-spacing:.04em;margin:0;flex:1;line-height:1.05}
.bar h1 small{display:block;font-family:var(--body);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--brass)}
.chip{background:rgba(27,39,45,.88);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:14px;min-height:40px}
#time{font-variant-numeric:tabular-nums;color:var(--dim);font-size:14px}
#stage{position:fixed;inset:0;overflow:hidden;background:#000}
#stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:default}
#joy{position:fixed;z-index:2;left:max(18px,env(safe-area-inset-left));bottom:max(22px,env(safe-area-inset-bottom));width:124px;height:124px;border-radius:50%;
  background:rgba(16,24,28,.4);border:2px solid rgba(232,226,210,.35);touch-action:none}
#knob{position:absolute;left:37px;top:37px;width:50px;height:50px;border-radius:50%;background:rgba(224,167,58,.85);pointer-events:none}
#keyhelp{position:fixed;z-index:2;left:max(14px,env(safe-area-inset-left));bottom:max(16px,env(safe-area-inset-bottom));display:none;background:rgba(16,24,28,.78);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-size:15px;line-height:1.7;pointer-events:none}
#keyhelp kbd{display:inline-block;min-width:26px;text-align:center;background:var(--paper);color:var(--paperink);border-radius:5px;border-bottom:3px solid #b6a577;padding:0 6px;font-family:var(--display);font-size:16px;margin-right:3px}
#flash{position:fixed;inset:0;z-index:9;background:#fff;opacity:0;pointer-events:none}
@media (hover:hover) and (pointer:fine) and (min-width:820px){#cap{left:calc(50% + 150px)}}
#toast{position:fixed;z-index:4;left:50%;top:max(64px,calc(env(safe-area-inset-top) + 56px));transform:translateX(-50%);background:rgba(16,24,28,.88);border:1px solid var(--brass);
  border-radius:8px;padding:8px 14px;font-size:15px;max-width:88%;text-align:center;opacity:0;transition:opacity .25s;pointer-events:none}
#toast.on{opacity:1}
#inv{position:fixed;z-index:2;right:max(8px,env(safe-area-inset-right));top:max(64px,calc(env(safe-area-inset-top) + 56px));width:50px;display:flex;flex-direction:column;align-items:center;gap:6px;
  padding:6px 0;background:rgba(27,39,45,.72);border:1px solid var(--line);border-radius:12px;font-size:20px}
#inv b{font-size:26px;font-weight:400;line-height:1.1}
#cap{position:fixed;z-index:2;left:50%;bottom:max(24px,env(safe-area-inset-bottom));transform:translateX(-50%);width:min(60vw,360px);margin:0;text-align:center;font-size:15px;
  color:var(--text);text-shadow:0 1px 4px #000,0 0 8px #000;pointer-events:none;transition:opacity .6s}
#veil{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-end;justify-content:center;z-index:10}
#veil.on{display:flex}
#sheet{width:100%;max-width:560px;max-height:88%;overflow:auto;background:var(--panel);border-top:3px solid var(--brass);border-radius:14px 14px 0 0;padding:16px 16px 24px;display:flex;flex-direction:column;gap:12px}
#sheet header{display:flex;align-items:center;gap:8px}
#sheet h2{font-family:var(--display);font-weight:400;font-size:24px;letter-spacing:.04em;margin:0;flex:1;text-wrap:balance}
#body{display:flex;flex-direction:column;gap:12px}
#body p{margin:0}
.paper{background:var(--paper);color:var(--paperink);font-family:var(--note);padding:14px;border-radius:3px;font-size:17px;box-shadow:0 3px 0 rgba(0,0,0,.3);transform:rotate(-.6deg);text-align:center}
.paper.big{font-size:25px;letter-spacing:.1em}
.mirror{background:linear-gradient(135deg,#b9d3dc,#e9f4f6 40%,#9fbac4);color:#1c2d33;font-family:var(--display);font-size:30px;letter-spacing:.1em;padding:22px 8px;text-align:center;border:6px solid #7b5a2c;border-radius:6px}
.mirror .m{display:inline-block;transform:scaleX(-1)}
.flip{transform:rotate(180deg)}
.canvas{background:#59605f;border:8px solid #7b5a2c;padding:18px 8px;text-align:center;border-radius:4px;color:#2f3433;font-size:15px}
.canvas .uv{font-size:34px;letter-spacing:.2em;color:#c9a6ff;text-shadow:0 0 12px #a6f;display:block;margin-top:8px}
.books{display:flex;gap:4px;justify-content:center;align-items:flex-end;background:#3a2a18;padding:12px 8px 0;border-bottom:8px solid #24190d;border-radius:4px}
.books span{width:34px;height:110px;border-radius:3px 3px 0 0;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:22px;color:rgba(0,0,0,.75);box-shadow:inset -4px 0 0 rgba(0,0,0,.2)}
.books span:nth-child(odd){height:96px}
.c-red{background:#d9463b}.c-blue{background:#3f7fd8}.c-yellow{background:#ecc63a}.c-green{background:#3fae62}.c-orange{background:#ea8a2e}.c-purple{background:#8c5fd0}
.rainbow{display:flex;flex-direction:column;border-radius:6px;overflow:hidden;border:6px solid var(--paper)}
.rainbow i{height:22px;display:block}
table.clues{border-collapse:collapse;width:100%;font-size:15px}
table.clues td{padding:8px 6px;border-bottom:1px solid var(--line)}
table.clues td:first-child{font-family:var(--display);font-size:24px;letter-spacing:.25em;color:var(--brass);white-space:nowrap}
.grid{display:grid;gap:4px;justify-content:center}
.grid span{width:44px;height:44px;background:#4c5356;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:24px;border-radius:4px}
.grid span.q{color:var(--brass);background:#2a3236}
.grid span.h{background:none;color:var(--dim);font-size:16px}
.pyr{display:flex;flex-direction:column;align-items:center;gap:4px}
.pyr div{display:flex;gap:4px}
.pyr span{width:52px;height:40px;background:#b89a5a;color:#2b241a;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:24px;border-radius:3px}
.disp{font-family:var(--display);font-size:34px;letter-spacing:.35em;text-align:center;background:#0a0f11;border:1px solid var(--line);border-radius:6px;padding:8px 0 8px .35em;min-height:62px;color:var(--good)}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.keys button,.btn{background:#26363d;border:1px solid var(--line);border-bottom-width:3px;border-radius:8px;min-height:50px;font-size:20px}
.btn{padding:0 16px;font-size:17px}
.btn.go{background:var(--brass);border-color:#a87a1f;color:#1d1503;font-weight:700}
.seq{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.seq.six{grid-template-columns:repeat(3,1fr)}
.seq button{min-height:60px;border-radius:8px;border:0;border-bottom:4px solid rgba(0,0,0,.35);font-size:26px;color:#111}
.seq button.arrow{background:#26363d;color:var(--text)}
.dots{display:flex;gap:6px;justify-content:center;min-height:14px}
.dots i{width:12px;height:12px;border-radius:50%;background:var(--line)}
.dots i.f{background:var(--brass)}
.lights{display:grid;grid-template-columns:repeat(3,72px);gap:8px;justify-content:center}
.lights button{height:72px;border-radius:50%;border:3px solid #0a0f11;background:#2a3236}
.lights button.on{background:radial-gradient(#fff7c2,#f2c230);box-shadow:0 0 18px #f2c23099}
.sw{display:flex;gap:8px;justify-content:center}
.sw button{width:44px;height:84px;border-radius:8px;border:1px solid var(--line);background:#0a0f11;position:relative}
.sw button::after{content:"";position:absolute;left:6px;right:6px;height:34px;bottom:6px;border-radius:5px;background:#55656c}
.sw button.on::after{bottom:auto;top:6px;background:var(--brass)}
input.word{width:100%;font:inherit;font-family:var(--display);font-size:28px;letter-spacing:.2em;text-transform:uppercase;text-align:center;background:#0a0f11;color:var(--good);border:1px solid var(--line);border-radius:6px;padding:10px}
.msg{min-height:1.4em;color:var(--bad);text-align:center;font-size:15px}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-7px)}50%{transform:translateX(7px)}75%{transform:translateX(-4px)}}
@media (prefers-reduced-motion:reduce){.shake{animation:none}#toast{transition:none}}
.rooms{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.rooms .btn{padding:0;font-size:16px;min-height:44px}
.rooms button[disabled]{opacity:.35;cursor:default}
.stat{font-family:var(--display);font-size:22px;color:var(--brass)}
.cards{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;min-height:50px}
.cards button{background:var(--paper);color:var(--paperink);font-family:var(--note);font-size:21px;min-height:46px;padding:0 14px;border:0;border-bottom:4px solid #b6a577;border-radius:6px}
.rowb{display:flex;gap:8px}.rowb .btn{flex:1}
#bpap{background:none;border:0;font-size:26px;line-height:1;padding:4px 0 2px;position:relative;width:100%}
#pcount{position:absolute;right:3px;top:-2px;background:var(--brass);color:#1d1503;border-radius:9px;font:700 12px/16px var(--body);min-width:16px;padding:0 3px}
.strip{display:flex;flex-direction:column;gap:6px}.strip>small{color:var(--dim);font-size:13px;text-transform:uppercase;letter-spacing:.06em}
</style>
</head>
<body>
<div id="app">
  <div class="bar">
    <h1><small id="rnum">Room 1 of 40</small><span id="rname">Broom Closet</span></h1>
    <span id="time">0:00</span>
    <button class="chip" id="bhint">Hint</button>
    <button class="chip" id="brooms">Rooms</button>
    <button class="chip" id="bsnd" aria-label="Sound: music and effects on">🎵</button>
    <button class="chip" id="bhome" style="display:none" aria-label="All games">🏠</button>
  </div>
  <div id="stage"><canvas id="cv" aria-label="3D room. Drag to look around, tap things to search them."></canvas>
    </div>
  <div id="flash"></div>
  <div id="toast" role="status"></div>
  <div id="keyhelp"><div><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> or arrow keys: walk</div><div><kbd>Q</kbd><kbd>E</kbd> or drag with the mouse: look around (drag right = look right)</div><div>Click the floor: walk there</div><div>Click things to open them</div></div>
  <div id="joy" aria-label="Move. Drag to walk, or use the arrow keys."><div id="knob"></div></div>
  <div id="inv" aria-label="Pockets"><span aria-hidden="true">🎒</span><span id="items" style="display:contents"></span><button id="bpap" aria-label="Paper strips you have found">📜<span id="pcount"></span></button></div>
  <p id="cap"></p>
</div>
<div id="veil"><div id="sheet" role="dialog" aria-modal="true">
  <header><h2 id="stitle"></h2><button class="chip" id="sclose">Close</button></header>
  <div id="body"></div>
</div></div>

<script src="three.min.js"></script>
<script id="data">
/* ---------- clues ---------- */
const note=(t,big)=>`<div class="paper${big?' big':''}">${t}</div>`;
function clockSvg(h,m,nums){ let t=''; for(let i=0;i<12;i++){const a=i*Math.PI/6; t+=`<line x1="${50+38*Math.sin(a)}" y1="${50-38*Math.cos(a)}" x2="${50+43*Math.sin(a)}" y2="${50-43*Math.cos(a)}" stroke="#2b241a" stroke-width="${i%3?1:2.5}"/>`;}
  const P=(a,r)=>`x2="${50+r*Math.sin(a*Math.PI/180)}" y2="${50-r*Math.cos(a*Math.PI/180)}"`;
  const n=nums?'<text x="50" y="20" text-anchor="middle" font-size="9">12</text><text x="83" y="53" text-anchor="middle" font-size="9">3</text><text x="50" y="87" text-anchor="middle" font-size="9">6</text><text x="17" y="53" text-anchor="middle" font-size="9">9</text>':'';
  return `<svg viewBox="0 0 100 100" style="width:200px;align-self:center;display:block;margin:auto" role="img" aria-label="A clock face"><circle cx="50" cy="50" r="46" fill="#f1e6c8" stroke="#7b5a2c" stroke-width="4"/>${t}${n}<line x1="50" y1="50" ${P(h,22)} stroke="#2b241a" stroke-width="4" stroke-linecap="round"/><line x1="50" y1="50" ${P(m,34)} stroke="#2b241a" stroke-width="2.4" stroke-linecap="round"/><circle cx="50" cy="50" r="3" fill="#2b241a"/></svg>`; }
const bk=a=>'<div class="books">'+a.map(b=>`<span class="c-${b[0]}">${b[1]||''}</span>`).join('')+'</div>';
const cbT=r=>'<table class="clues">'+r.map(x=>`<tr><td>${x[0]}</td><td>${x[1]}</td></tr>`).join('')+'</table>';
const CL={
 sky:note('🌙 ⭐ 🌙 ☀️ 🌙<br>⭐ 🌙 ☀️ ⭐ 🌙',1)+'<p>A hand-painted sky. Somebody counted very carefully.</p>',
 clock720:clockSvg(220,120,1)+'<p>The hands are frozen.</p>',
 n45:note('I always lock up 45 minutes after the clocks stop.'),
 books5:bk([['blue'],['red'],['yellow'],['green'],['blue']])+'<p>Five books, neatly lined up. Every other shelf is a mess.</p>',
 ltr:'<p>A card was under the vase.</p>'+note('Read left to right, like always.'),
 mirror:'<div class="mirror"><span class="m">SIX NINE TWO FIVE</span></div><p>Someone wrote on the glass with a finger. From the other side.</p>',
 count3:note('Count the stock every night:<br><br>BARRELS · VASES · CRATES'),
 plaque9:note('ALL NINE LAMPS LIT = SAFE OPENS'),
 dice:note('⚂ ⚅ ⚀',1)+'<p>Three dice were left on a table. The lock wants the numbers facing the table.</p>',
 dice7:'<p>A note was under the vase.</p>'+note('Opposite sides of a dice always add up to 7.'),
 books6:bk([['green',20],['purple',15],['red',5],['yellow',9],['blue',3],['orange',24]])+'<p>Six books with numbers on their spines.</p>',
 rainbow:'<div class="rainbow"><i class="c-red"></i><i class="c-orange"></i><i class="c-yellow"></i><i class="c-green"></i></div><p>Half a rainbow. The bottom was torn off.</p>',
 a1z26:'<p>A scroll was inside the vase.</p>'+note('A is 1.<br>B is 2.<br>Z is 26.<br><br>Read the rainbow.'),
 compass:note('N<br>W ✛ E<br>S',1)+'<p>An old compass. North is at the top.</p>',
 route:note('Captain’s route:<br><br>N, W, W, S, E, N',0),
 mix:note('🔴 + 🟡<br>🟡 + 🔵<br>🔵 + 🔴<br>🟡 + 🔴',1)+'<p>Mix each pair of paints. Press what you get.</p>',
 cb042:cbT([['682','One digit is right and in the right place.'],['614','One digit is right but in the wrong place.'],['206','Two digits are right but both in the wrong place.'],['738','Nothing is right.'],['780','One digit is right but in the wrong place.']]),
 cb573:cbT([['519','One digit is right and in the right place.'],['725','Two digits are right but both in the wrong place.'],['194','Nothing is right.'],['382','One digit is right but in the wrong place.'],['678','One digit is right and in the right place.']]),
 phone:'<div class="grid" style="grid-template-columns:repeat(3,64px)">'+['1','2 ABC','3 DEF','4 GHI','5 JKL','6 MNO','7 PQRS','8 TUV','9 WXYZ'].map(k=>`<span style="width:64px;font-size:16px">${k}</span>`).join('')+'</div><p>The buttons of a very old phone.</p>',
 truth:note('Only ONE label tells the truth.<br><br>Open the wrong chest and the floor opens instead.'),
 updown:'<div class="canvas flip"><div>THIS WAY UP ▲</div><span class="uv">↑ → ↓ ↓ ← ↑</span></div><p>In the torchlight, marks glow on the canvas. It was hung carelessly.</p>',
 fib:note('1, 1, 2, 3, 5, 8, ?, ?',1)+'<p>On the back: "the safe wants the two that are missing".</p>',
 zoo:note('🐱 + 🐶 = 10 kg<br>🐶 + 🐦 = 7 kg<br>🐱 + 🐦 = 9 kg',1)+'<p>The zookeeper weighed them two at a time.</p>',
 roman:note('MMXXVI − XLII',1)+'<p>Carved over the bath.</p>',
 romankey:'<p>A tile was under the vase.</p>'+note('I=1 &nbsp;V=5 &nbsp;X=10 &nbsp;L=50<br>C=100 &nbsp;D=500 &nbsp;M=1000<br><br>A small one in front of a big one is taken away.'),
 mclock:'<div class="mirror" style="padding:10px"><div class="m" style="display:block">'+clockSvg(250,120,0)+'</div></div><p>A clock, seen in the mirror.</p>',
 mnote:note('The clock hangs on the wall behind you. You can only see it in the mirror.<br><br>What time is it really?'),
 pyr:'<div class="pyr">'+[['31'],['?','?'],['?','?','?'],['4','?','3','6']].map(r=>'<div>'+r.map(x=>`<span>${x}</span>`).join('')+'</div>').join('')+'</div><p>Each brick is the two bricks under it added together. The safe wants the second row from the bottom.</p>',
 morse:note('— — —<br>· — — ·<br>·<br>— ·',1)+'<p>The radio keeps repeating four signals.</p>',
 morsekey:note('A · —<br>E ·<br>N — ·<br>O — — —<br>P · — — ·<br>S · · ·<br>T —'),
 seq2:note('2, 6, 12, 20, 30, ?<br><br>1, 4, 9, 16, ?')+'<p>The safe wants both answers side by side.</p>',
 grid:(()=>{const R=['KMTRA','POLEW','NSHCU','FDIGY','BJVQX'];let h='<div class="grid" style="grid-template-columns:repeat(6,44px)"><span class="h"></span>'+'ABCDE'.split('').map(c=>`<span class="h">${c}</span>`).join('');R.forEach((r,i)=>{h+=`<span class="h">${i+1}</span>`+r.split('').map(c=>`<span>${c}</span>`).join('');});return h+'</div><p>A map with letters where the towns should be.</p>';})(),
 day:note('The day after tomorrow is Sunday.<br><br>What day was yesterday?'),
 magic:'<div class="grid" style="grid-template-columns:repeat(3,44px)">'+[8,'?',6,'?',5,'?',4,'?',2].map(n=>`<span class="${n==='?'?'q':''}">${n}</span>`).join('')+'</div><p>Every row, column and diagonal adds up the same. The safe wants what is missing, read like a book.</p>',
 caesar3:note('Caesar was here.<br>He pushed every letter 3 forward.'),
 caesar1:note('D R B Z O D',1)+'<p>Underneath: "Every letter is hiding one step behind itself. B is hiding as A."</p>',
 count4:note('Count BOTH rooms:<br><br>PAINTINGS · BARRELS · VASES · CRATES'),
 crew:note('CREW ON BOARD:<br>4 astronauts'),
 hours:note('Each astronaut has 9 hours of air.<br><br>The console asks for CREW × HOURS.'),
 cell:note('Scratched under the bunk:<br>"Every prisoner dreams of being ____."<br><br>The opposite of locked up.'),
 seas:note('Captain’s log:<br>"We have sailed all SEVEN oceans.<br>That is more than one!"'),
 chart:note('Patient chart:<br>2 pills<br>3 times a day<br>for 4 days'),
 ward:note('Heard on the ward:<br>"The nurse ... the patient."<br><br>Who helps who? Both ways make sense.'),
 dive:note('Depth gauge:<br>dives 15 metres<br>every minute.<br><br>Dive time today: 6 minutes.'),
 subord:note('Captain’s order, torn in pieces:<br>dive · We · must · down · now'),
 lem:note('Taste log:<br>Sugar tastes sweet.<br>Honey tastes sweet.<br>Lemons taste ... ?'),
 ghosts:note('A ghost count:<br>7 ghosts live here.<br>Each haunts 8 rooms.'),
 ghostmsg:note('Written in glowing paint:<br>"The ghost says ... "<br><br>What does a ghost say?'),
 board:note('On the blackboard:<br>7 + 8 = 15<br>15 − 6 = 9<br>9 × 3 = ?'),
 monkeys:note('6 monkeys live in the ruins.<br>Each one hid 7 bananas.'),
 lab:note('8 flasks on the shelf.<br>Each flask has 7 drops of potion.'),
 lab2:note('Chemistry class:<br>Water is made of hydrogen and ... ?<br><br>(Six letters. The air you breathe.)')
};
const G3=['gem1','gem2','gem3'];

function box(el,html){ const w=document.createElement('div'); w.style.cssText='display:flex;flex-direction:column;gap:8px'; w.innerHTML=html; el.appendChild(w); return w; }

function buildRoom(){
  if(roomG) scene.remove(roomG); roomG=new T.Group(); scene.add(roomG); HIT=[]; TW=[]; PROPS=[]; COL=[]; doorPivot=null;
  const L=LV[S.lvl], th=room?['stone','#6a5a3c','stone','#3d3424']:L.th;
  const wm=mat('#ffffff',{map:tex(th[0],th[1],5,2.5),side:T.BackSide}), fm=mat('#ffffff',{map:tex(th[2],th[3],5,5),side:T.BackSide}), cm=mat(th[1],{side:T.BackSide});
  cm.color.multiplyScalar(.55);
  const box=new T.Mesh(BX(10,5,10),[wm,wm,cm,fm,wm,wm]); box.position.y=2.5; roomG.add(box);
  amb.intensity=room?.55:.72; lamp.color.set(room?0xffd28a:0xfff0d0);
  if(!room){ const D=new T.Group(); D.position.set(0,0,-4.98); roomG.add(D);
    D.add(M(BX(2.0,3.3,.1),'#1a1208',0,1.65,0)); D.add(M(BX(1.6,3.1,.02),new T.MeshBasicMaterial({color:0xffe9a8}),0,1.55,.06));
    doorPivot=new T.Group(); doorPivot.position.set(-.8,0,.1); doorPivot.add(M(BX(1.6,3.1,.08),'#8a6238',.8,1.55,0)); doorPivot.add(M(BX(1.2,1.1,.03),'#74502c',.8,2.2,.05)); doorPivot.add(M(BX(1.2,1.1,.03),'#74502c',.8,.85,.05)); doorPivot.add(M(new T.SphereGeometry(.09,12,10),'#e0a73a',1.42,1.5,.1)); D.add(doorPivot);
    doorLight=new T.PointLight(0xffd890,0,14); doorLight.position.set(0,1.7,-3.9); roomG.add(doorLight);
    hit(D,2.0,3.3,.4,0,1.65,.15,doorTap);
  } else { const A=new T.Group(); A.position.set(0,0,4.98); A.rotation.y=Math.PI; roomG.add(A); arch(A,()=>enter(0),.03); }
  (room?L.secret:L.main).forEach((def,i)=>addProp(def,i));
}
function addProp(def,i){
  const kind=def[0], slot=def[1], o=def[2]||{}, s=SL[slot], isM=slot[0]==='m';
  const G=new T.Group(); G.position.set(s[0],0,s[1]); G.rotation.y=isM?Math.atan2(-s[0],-s[1]):s[2]; roomG.add(G);
  const b=B[kind](o,i), body=b.g, z=isM?0:(b.wall?.06:b.size[2]/2+.14); body.position.z=z; G.add(body);
  let style=b.style; if(o.secret) style='sink'; else if(o.clue&&b.wall) style='none';
  const p={id:room+':'+slot,kind,o,G,body,style,lid:b.lid,dir:s[3],pop:[0,kind==='rug'?.5:b.wall?b.cy:style==='hop'?.6:b.size[1]+.25,z],z};
  hit(body,b.size[0]+.2,b.size[1]+.2,b.size[2]+.2,0,b.cy,0,()=>tapProp(p)); PROPS.push(p);
  if(!b.wall&&kind!=='rug'){ const r=Math.max(b.size[0],b.size[2])/2*(kind==='shelf'?.8:.85); COL.push([s[0]+(isM?0:Math.sin(s[2])*(z-.0)),s[1]+(isM?0:Math.cos(s[2])*z),r]); }
  if((F[p.id]||{}).open) moveProp(p,0);
}
function moveProp(p,d){
  if(p.style==='hop') tw(p.body.position,'x',p.dir*(p.kind==='rug'?1.25:1.05),d);
  else if(p.style==='up') tw(p.body.position,'y',1.3,d);
  else if(p.style==='sink'){ tw(p.body.position,'y',-3.5,d*2); if(!p.arch){ p.arch=1; arch(p.G,()=>enter(1),.03); } }
  else if(p.style==='lid') tw(p.lid.rotation,'x',-1.75,d);
  else if(p.style==='door') tw(p.lid.rotation,'y',-1.9,d);
}
function give(n,p){ inv.push(n); drawInv(); toast('You found '+INAME[n]+'!'); if(n==='key') AU.key(); else AU.item();
  const m=itemMesh(n), v=p.G.localToWorld(new T.Vector3(p.pop[0],p.pop[1],p.pop[2]+.25)); m.position.copy(v); scene.add(m); POP.push({m,t:0,y:v.y}); }
function addPaper(id,title,html){ F.papers=F.papers||[]; if(!F.papers.some(x=>x.id===id)){ F.papers.push({id,title,html}); toast('Paper strip saved. Tap 📜 to read it again.'); } $('#pcount').textContent=F.papers.length||''; }
function showClue(p){ addPaper(p.id,KNAME[p.kind],CL[p.o.clue]); sheet(KNAME[p.kind],CL[p.o.clue]); }
$('#bpap').onclick=()=>{ const P=F.papers||[]; sheet('Paper strips',P.length?P.map(x=>`<div class="strip"><small>${x.title}</small>${x.html}</div>`).join(''):'<p>No paper strips yet. Notes, charts and lock questions you find are saved here so you can read them again quickly.</p>'); };
function tapProp(p){
  const o=p.o, st=F[p.id]||(F[p.id]={}), name=KNAME[p.kind];
  if(st.open){ if(o.secret) return enter(1); if(o.clue) return showClue(p); return toast('Nothing else here.'); }
  if(o.needs){ const miss=o.needs.filter(n=>!has(n));
    if(miss.length){ const m=miss[0];
      return sheet(name, m.startsWith('gem')?`<p>Three empty sockets: red, blue and green. You have ${3-miss.length} of 3 gems.</p>`: m==='hammer'?'<p>Nailed shut. You need a tool to break it open.</p>': m==='card'?'<p>The screen says: SWIPE KEYCARD.</p>':'<p>Too dark to read. You need a light.</p>'); } }
  if(o.ask&&!st.asked) return sheet(name,`<p>${o.ask}</p><button class="btn go" id="openit">Open this chest</button>`,el=>el.querySelector('#openit').onclick=()=>{ st.asked=1; closeSheet(); tapProp(p); });
  if(o.lock&&!st.unlocked) return lockSheet(p,()=>{ st.unlocked=1; AU.ok(); closeSheet(); tapProp(p); });
  if(o.needs&&o.needs[0].startsWith('gem')){ inv=inv.filter(n=>!n.startsWith('gem')); drawInv(); }
  st.open=1; moveProp(p,650);
  if(o.secret){ AU.rumble(); shake=.09; dust(p); } else if(!o.trap) AU.tick();
  if(o.trap){ done=true; return setTimeout(()=>sheet('Wrong chest','<p>The chest is empty. Then the floor drops away, and you land back where the room began.</p><button class="btn go" id="again">Try the room again</button>',el=>el.querySelector('#again').onclick=()=>start(S.lvl)),700); }
  if(o.has) setTimeout(()=>give(o.has,p),p.style==='none'?0:450);
  else if(o.secret) toast('A secret doorway!');
  else if(o.clue) setTimeout(()=>showClue(p),p.style==='none'?0:600);
  else toast(o.flavor||(p.style==='none'?'It will not move. Nothing hidden here.':'Nothing hidden here.'));
}
let moving=false;
function enter(r){ if(moving) return; moving=true; AU.whoosh(); fade('#000',240,1,()=>{ enterNow(r); fade('#000',340,0); moving=false; }); }
function enterNow(r){ room=r; buildRoom(); yaw=0; pitch=-.12; yawTo=null; walk=null; px=0; pz=r?3:0; closeSheet(); say(r?'A secret room. The doorway behind you leads back.':LV[S.lvl].i); toast(r?'Secret room':'Back in the main room'); }
function doorTap(){ if(done) return; if(has('key')) win(); else { AU.thud(); sheet('The door','<p>Locked. You need the key.</p>'); } }

/* ---------- game loop ---------- */
function drawInv(){ $('#items').innerHTML=inv.map(n=>`<b title="${INAME[n]}">${ICON[n]}</b>`).join(''); }
function start(n){ S.lvl=n; F={}; cut=null; shake=0; moving=false; fade('#000',1,0); $('#pcount').textContent=''; inv=[]; hintAt=0; done=false; room=0; save(); closeSheet();
  const L=LV[n]; $('#rnum').textContent=`Room ${n+1} of ${LV.length}`; $('#rname').textContent=L.n; say(L.i);
  drawInv(); yaw=0; pitch=-.12; yawTo=null; walk=null; px=0; pz=0; buildRoom(); }
function win(){ if(done||!doorPivot) return; done=true; closeSheet(); walk=null;
  AU.creak(); tw(doorPivot.rotation,'y',-1.5,1100); if(doorLight) tw(doorLight,'intensity',3,1400); setTimeout(()=>AU.fanfare(),1500);
  const last=S.lvl===LV.length-1; if(!last) S.max=Math.max(S.max,S.lvl+1); save();
  const finish=()=>{
    if(last){ const rank=S.hints===0?'Master Escapist':S.hints<=16?'Lock Picker':'Free at Last';
      sheet('You escaped',`<p>Daylight. All forty rooms are behind you.</p><p class="stat">${rank}</p><p>Time ${fmt(S.ms)} · Hints used ${S.hints}</p><button class="btn go" id="again">Play again from room 1</button>`,
        el=>el.querySelector('#again').onclick=()=>{S.hints=0;S.ms=0;S.max=LV.length-1;start(0);});
    } else sheet('Door open',`<p>${LV[S.lvl].n} cleared.</p><button class="btn go" id="next">Go to room ${S.lvl+2}</button>`,el=>el.querySelector('#next').onclick=()=>start(S.lvl+1));
    fade('#fff',900,0);
  };
  cut={t:0,d:2.6,fx:px,fz:pz,fy:yaw,fp:pitch,tx:0,tz:-3.7,ty:0,tp:.04,end:finish};
}
$('#bhint').onclick=()=>{ const H=LV[S.lvl].hints;
  const show=i=>sheet(`Hint ${i+1} of ${H.length}`,`<p>${H[i]}</p>`+(i<H.length-1?'<button class="btn" id="more">I need a bigger hint</button>':''),
    el=>{const m=el.querySelector('#more'); if(m) m.onclick=()=>{ if(hintAt<i+2){hintAt=i+2;S.hints++;save();} show(i+1); };});
  if(hintAt===0){hintAt=1;S.hints++;save();} show(hintAt-1); };
$('#brooms').onclick=()=>sheet('Rooms','<div class="rooms">'+LV.map((r,i)=>`<button class="btn" data-i="${i}" ${i>S.max?'disabled':''} aria-label="Room ${i+1}${i>S.max?' locked':''}">${i>S.max?'🔒':i+1}</button>`).join('')+'</div><p style="color:var(--dim)">Clear a room to unlock the next one.</p>',
  el=>el.querySelector('.rooms').onclick=e=>{const b=e.target.closest('button'); if(b&&!b.disabled) start(+b.dataset.i);});
const fmt=ms=>{const s=Math.floor(ms/1000);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');};
setInterval(()=>{ if(!done&&!document.hidden){S.ms+=1000; $('#time').textContent=fmt(S.ms); if(S.ms%10000===0) save();} },1000);
$('#time').textContent=fmt(S.ms);
if(!TOUCH){ $('#joy').style.display='none'; $('#keyhelp').style.display='block'; $('#cv').setAttribute('aria-label','3D room. Walk with W A S D or the arrow keys, drag to look, click things.'); }
const ON_SITE=/^https?:$/.test(location.protocol)&&!/claude|anthropic/i.test(location.hostname);
if(ON_SITE){const h=$('#bhome');h.style.display='';h.onclick=()=>{location.href=new URL('../',location.href).href;};}
try{ init3D(); start(Math.min(S.lvl||0,LV.length-1)); }
catch(e){ say('This device could not start the 3D view. Try another browser.',60000); }
</script>
<script>
if('serviceWorker' in navigator && location.protocol!=='file:'){
  addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
</script>
