<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Star Army Online — players right now</title>
<style>
  :root{--ink:#222;--paper:#f8f6f0;--green:#1e7a3a;--muted:#6b6b6b}
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;padding:20px}
  .card{max-width:520px;margin:0 auto;background:#fff;border:3px solid var(--ink);border-radius:12px 18px 14px 16px;box-shadow:4px 5px 0 var(--ink);padding:20px 22px}
  h1{font-size:18px;margin:0 0 4px}
  .sub{color:var(--muted);font-size:13px;margin:0 0 14px}
  .big{display:flex;align-items:baseline;gap:12px}
  .num{font-size:84px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
  .label{font-size:18px;font-weight:600}
  .dot{display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--green);margin-right:6px;vertical-align:middle}
  .dot.off{background:#bbb}
  .rooms{margin:10px 0 0;font-size:15px}
  .row{display:flex;justify-content:space-between;gap:12px;margin-top:16px;font-size:13px;color:var(--muted)}
  svg{width:100%;height:70px;margin-top:14px;display:block}
  .err{margin-top:12px;font-size:13px;color:#a33;display:none}
  .peak{font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<div class="card">
  <h1><span class="dot off" id="dot"></span>Star Army Online</h1>
  <p class="sub">Players in online rooms right now, from felixwang.pages.dev. Checks every 10 seconds.</p>
  <div class="big"><div class="num" id="num">–</div><div class="label" id="lbl">players online</div></div>
  <div class="rooms" id="rooms">&nbsp;</div>
  <svg id="spark" viewBox="0 0 300 70" preserveAspectRatio="none" aria-label="Players online over the time this page has been open"></svg>
  <div class="row"><span id="updated">Connecting…</span><span class="peak" id="peak"></span></div>
  <div class="err" id="err"></div>
</div>
<script>
const URL_ = '../api/online';
const hist = []; let peak = 0, fails = 0;
const $ = id => document.getElementById(id);
function draw() {
  const svg = $('spark'); const n = hist.length; if (!n) { svg.innerHTML = ''; return; }
  const max = Math.max(2, ...hist.map(h => h.p));
  const pts = hist.map((h, i) => [n === 1 ? 300 : i / (n - 1) * 300, 64 - h.p / max * 56]);
  const line = pts.map(p => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' ');
  svg.innerHTML = '<line x1="0" y1="64" x2="300" y2="64" stroke="#ddd" stroke-width="1"/>' +
    '<polyline points="' + line + '" fill="none" stroke="#1e7a3a" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>' +
    '<circle cx="' + pts[n - 1][0].toFixed(1) + '" cy="' + pts[n - 1][1].toFixed(1) + '" r="3.5" fill="#1e7a3a"/>';
}
async function check() {
  try {
    const r = await fetch(URL_ + '?t=' + Date.now(), { cache: 'no-store' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const j = await r.json(); const p = j.players | 0, rooms = j.rooms | 0;
    fails = 0; $('err').style.display = 'none'; $('dot').className = 'dot';
    $('num').textContent = p; $('lbl').textContent = p === 1 ? 'player online' : 'players online';
    $('rooms').textContent = rooms === 0 ? 'No rooms open' : rooms + (rooms === 1 ? ' room open' : ' rooms open') + ' · ' +
      (p >= rooms * 2 ? 'all playing' : (rooms * 2 - p) + ' waiting for a friend');
    peak = Math.max(peak, p); $('peak').textContent = 'Most since opened: ' + peak;
    hist.push({ t: Date.now(), p }); while (hist.length > 360) hist.shift(); draw();
    $('updated').textContent = 'Updated ' + new Date().toLocaleTimeString();
  } catch (e) {
    fails++; $('dot').className = 'dot off';
    if (fails >= 2) { $('err').style.display = 'block'; $('err').textContent = "Can't reach the game server right now (" + (e.message || 'blocked') + '). It will keep trying.'; }
  }
}
check(); setInterval(check, 10000);
</script>
</body>
</html>
